<!doctype html>
<html lang="en"><head>
<script src="/pb-shim.js"></script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta charset="utf-8" data-keep="">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" data-keep="">
<title data-keep="">PPSU Game Management</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&amp;display=swap" rel="stylesheet" data-keep="">
<style id="vcss" data-keep="">
#vroot{--navy:#0f2a5e;--lime:#9be21d;--org:#ff6a13;--bg:#e9f5ff;--card:#fff;--tx:#10244a;--mu:#5d6f93;--ac:#2f9e2f;--ac2:#e3f6c4;--bd:#d5e6f7;--sh:0 6px 18px rgba(16,42,94,.12);--live:#d6341f;--win:#e3f6c4;min-height:100vh;color:var(--tx);font:15px/1.45 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg) linear-gradient(180deg,#8fd0ff 0,var(--bg) 320px) no-repeat;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
@media(prefers-color-scheme:dark){#vroot{--bg:#081530;--card:#102447;--tx:#eaf3ff;--mu:#9db3da;--ac:#8de028;--ac2:#25421e;--bd:#233a6a;--sh:0 6px 18px rgba(0,0,0,.4);--live:#ff8a78;--win:#25421e;background:var(--bg) linear-gradient(180deg,#12336b 0,var(--bg) 320px) no-repeat}}
#vroot *{box-sizing:border-box}
#vroot .vh{display:flex;align-items:center;gap:12px;padding:14px 16px 8px;max-width:820px;margin:auto}
#vroot .vh img{height:60px;width:auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
#vroot .vh h1{margin:0;font-size:21px;line-height:1.15;color:var(--tx)}
#vroot .sub{color:var(--mu);font-size:13px;font-weight:700}
#vroot main{max-width:820px;margin:auto;padding:4px 14px 0}
#vroot .seg{display:flex;gap:4px;max-width:788px;margin:4px auto 8px;background:var(--card);border-radius:999px;padding:3px;box-shadow:var(--sh);width:calc(100% - 28px)}
#vroot .seg button{flex:1;border:0;background:none;border-radius:999px;padding:7px 8px;font:800 13px Nunito,system-ui,sans-serif;color:var(--mu);cursor:pointer}
#vroot .seg button.on{background:var(--navy);color:#fff}
#vroot .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
#vroot .chips button{flex:none;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 13px;font:800 13px Nunito,system-ui,sans-serif;cursor:pointer}
#vroot .chips button.on{background:var(--ac2);border-color:var(--ac);color:var(--tx)}
#vroot .card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:14px;margin:0 0 12px}
#vroot h2{margin:0 0 8px;font-size:16px;color:var(--tx)}
#vroot h3{margin:12px 0 6px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
#vroot .mu{color:var(--mu);font-size:13px}
#vroot .tag{display:inline-block;background:var(--bd);color:var(--tx);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:900;margin:0 4px 4px 0}
#vroot .tag.nv{background:var(--navy);color:#fff}
#vroot .tag.lv{background:var(--live);color:#fff}
#vroot .tag.df{background:#ffe3a0;color:#6b4a00}
#vroot .gm{border:1.5px solid var(--bd);border-radius:14px;padding:10px 12px;margin:0 0 8px}
#vroot .gm.live{border-color:var(--live)}
#vroot .tm{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 8px;border-radius:10px;font-weight:800}
#vroot .tm small{display:block;color:var(--mu);font-weight:700;font-size:12px}
#vroot .tm .sc{font-size:20px;font-weight:900;min-width:28px;text-align:right}
#vroot .tm.win{background:var(--win)}
#vroot .tm.lose{opacity:.65}
#vroot .vs{text-align:center;color:var(--mu);font-size:11px;font-weight:900;letter-spacing:.12em;line-height:1}
#vroot table{width:100%;border-collapse:collapse;font-size:14px}
#vroot th{font-size:11px;color:var(--mu);text-transform:uppercase;text-align:left;padding:4px 6px}
#vroot td{padding:7px 6px;border-top:1px solid var(--bd);vertical-align:top}
#vroot td.n,#vroot th.n{text-align:center;width:34px}
#vroot .tw{overflow-x:auto}
#vroot .pod{display:flex;gap:8px;margin:0 0 10px}
#vroot .pod div{flex:1;border-radius:12px;padding:8px;text-align:center;font-weight:900;font-size:13px;background:var(--bd)}
#vroot .pod .g{background:#ffe27a;color:#4a3600}#vroot .pod .s{background:#e3e8ee;color:#2b333b}#vroot .pod .b{background:#f0b27a;color:#4a2a0c}
#vroot .pod small{display:block;font-weight:700}
#vroot .note{background:#fff6d6;color:#4a3600;border:1.5px solid #f2d36b}
#vroot .empty{text-align:center;color:var(--mu);padding:26px 12px;font-weight:700}
#vroot nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;justify-content:center;background:var(--card);box-shadow:0 -4px 16px rgba(16,42,94,.15);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
#vroot nav button{flex:1;max-width:220px;border:0;background:none;font:800 11px Nunito,system-ui,sans-serif;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border-radius:14px;cursor:pointer}
#vroot nav button span{font-size:19px;line-height:1}
#vroot nav button.on{background:var(--ac2);color:var(--tx)}
#vroot .rf{border:0;background:var(--card);box-shadow:var(--sh);border-radius:999px;padding:6px 12px;font:800 12px Nunito,system-ui,sans-serif;color:var(--tx);cursor:pointer;margin-left:auto}
#vroot .pill{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);margin-right:5px;animation:vp 1.2s infinite}
@keyframes vp{50%{opacity:.3}}
#vadmin{position:fixed;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:110;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#vadmin button{border:0;border-radius:999px;padding:10px 16px;font:800 13px Nunito,system-ui,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer;background:#0f2a5e;color:#fff}
#vadmin button.pub{background:#ff6a13}
#vmodal{position:fixed;inset:0;z-index:120;background:rgba(8,21,48,.6);display:flex;align-items:center;justify-content:center;padding:16px}
#vmodal .bx{background:#fff;color:#10244a;border-radius:18px;padding:18px;max-width:460px;width:100%;max-height:90vh;overflow:auto;font:15px/1.45 Nunito,system-ui,sans-serif}
#vmodal h2{margin:0 0 6px}
#vmodal textarea{width:100%;min-height:84px;border:1.5px solid #d5e6f7;border-radius:12px;padding:8px 10px;font:inherit;font-size:16px;resize:vertical}
#vmodal .r{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
#vmodal button{border:0;border-radius:999px;padding:9px 16px;font:800 14px Nunito,system-ui,sans-serif;cursor:pointer;background:#e3eefb;color:#10244a}
#vmodal button.go{background:#2f9e2f;color:#fff}
#vmodal .msg{margin-top:10px;font-weight:700;font-size:14px}
#vroot .tag.lv .pill{background:#fff}
#vroot .gm{padding:10px 10px 12px}
#vroot .gt{margin:0 0 6px}
#vroot .mt{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px}
#vroot .tx{font-weight:900;font-size:17px;line-height:1.3;text-align:center;padding:10px 8px;border-radius:12px;overflow-wrap:anywhere;background:rgba(127,160,200,.1)}
#vroot .tx small{display:block;font-size:14px;font-weight:700;color:var(--mu);margin-top:2px}
#vroot .tx b{display:block;font-size:18px}
#vroot .tx.win{background:var(--win)}
#vroot .tx.lose{opacity:.65}
#vroot .tx .cr{display:block;font-size:18px;line-height:1}
#vroot .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:34px;font-weight:900;color:var(--mu);font-size:13px;letter-spacing:.08em}
#vroot .mid b{font-size:24px;line-height:1.05;color:var(--tx)}
#vroot .mid i{font-style:normal;line-height:.9}
#vroot .watch{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;border:0;border-radius:18px;padding:16px 12px;margin:0 0 12px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#1f6fb8,#e0731a);box-shadow:var(--sh);font-family:inherit}
#vroot .watch span{font-size:28px;line-height:1}#vroot .watch b{font-size:17px}#vroot .watch small{font-size:12px;font-weight:700;opacity:.9}
#vann{position:fixed;inset:0;z-index:85;color:#fff;background:radial-gradient(1200px 700px at 50% 40%,#16357a 0%,#0a1a3f 55%,#050d22 100%);overflow:auto;display:flex;flex-direction:column}
#vann::before{content:"";position:fixed;inset:-50%;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 22px,transparent 22px 60px);animation:annMove 14s linear infinite;pointer-events:none}
@keyframes annMove{to{transform:translateX(120px)}}
.ann-top{position:relative;z-index:2;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px;flex-wrap:wrap}
.ann-grp{display:flex;gap:6px;flex-wrap:wrap}
.ann-btn{border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
.ann-btn.on{background:#fff;color:#0f2a5e}
.ann-stage{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 14px 28px;gap:14px;text-align:center}
.ann-banner{display:flex;font-weight:900;letter-spacing:.12em;text-transform:uppercase;transform:skewX(-10deg);animation:annDrop .6s cubic-bezier(.2,1.4,.4,1) both;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.ann-banner span{padding:10px 22px;font-size:clamp(16px,4.2vw,34px)}
.ann-banner .g{background:#ffb366;color:#3a1c00}.ann-banner .c{background:#7cc7ef;color:#06283f}
@keyframes annDrop{from{transform:translateY(-140%) skewX(-10deg);opacity:0}to{transform:translateY(0) skewX(-10deg);opacity:1}}
.ann-cat{font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:0;animation:annFade .5s .5s forwards;font-size:clamp(12px,2.6vw,20px);color:#bfe3f7}
.ann-row{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;max-width:1100px}
@media(min-width:760px){.ann-row{flex-direction:row;gap:0}}
.ann-team{flex:1;width:100%;box-sizing:border-box;padding:22px 18px;border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.ann-team.l{background:linear-gradient(135deg,#1f6fb8,#3fa9f5);animation:annL .8s .15s cubic-bezier(.2,1.1,.3,1) both}
.ann-team.r{background:linear-gradient(225deg,#e0731a,#ffa94d);animation:annR .8s .15s cubic-bezier(.2,1.1,.3,1) both}
@keyframes annL{from{transform:translateX(-120vw)}to{transform:none}}
@keyframes annR{from{transform:translateX(120vw)}to{transform:none}}
.ann-tn{font-weight:900;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(22px,5.5vw,46px);line-height:1.05;margin-bottom:8px;text-shadow:0 3px 12px rgba(0,0,0,.35);overflow-wrap:anywhere}
.ann-pl div{font-weight:700;font-size:clamp(16px,3.6vw,28px);opacity:0;animation:annUp .5s forwards;overflow-wrap:anywhere}
.ann-team.nt .ann-pl div{font-size:clamp(20px,4.6vw,38px);font-weight:900}
.ann-vs{flex:none;z-index:2;font-weight:900;font-style:italic;font-size:clamp(40px,10vw,96px);line-height:1;padding:0 8px;background:linear-gradient(180deg,#fff7c2,#ffc83a 55%,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px rgba(255,170,0,.6));animation:annVs .7s .7s cubic-bezier(.2,1.6,.4,1) both,annGlow 1.6s 1.5s ease-in-out infinite alternate}
@media(min-width:760px){.ann-vs{margin:0 -22px}}
@keyframes annVs{from{transform:scale(0) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes annGlow{to{filter:drop-shadow(0 4px 26px rgba(255,200,60,.95))}}
@keyframes annUp{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes annFade{to{opacity:1}}
.ann-flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3;animation:annFlash .6s .75s ease-out}
@keyframes annFlash{0%{opacity:.5}100%{opacity:0}}
.ann-foot{opacity:.7;font-size:12px;font-weight:800;letter-spacing:.08em}
.ann-empty{font-size:clamp(18px,4vw,30px);font-weight:800;opacity:.85;animation:annFade .5s forwards}
@media(prefers-reduced-motion:reduce){#vann *,#vann::before{animation:none!important}.ann-team,.ann-banner,.ann-vs,.ann-cat,.ann-pl div{opacity:1!important}.ann-flash{display:none}}
.ann-win{font-weight:900;letter-spacing:.18em;text-transform:uppercase;font-size:clamp(20px,5vw,44px);background:linear-gradient(180deg,#fff7c2,#ffc83a 55%,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px rgba(255,170,0,.6));animation:annZoom .7s .3s cubic-bezier(.2,1.6,.4,1) both}
@keyframes annZoom{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
.ann-team.w.l{scale:1.05;z-index:2;animation:annL .8s .15s cubic-bezier(.2,1.1,.3,1) both,annPulse 1.4s 1s ease-in-out infinite alternate}
.ann-team.w.r{scale:1.05;z-index:2;animation:annR .8s .15s cubic-bezier(.2,1.1,.3,1) both,annPulse 1.4s 1s ease-in-out infinite alternate}
.ann-team.lo.l{animation:annL .8s .15s cubic-bezier(.2,1.1,.3,1) both,annDim .6s 1s both}
.ann-team.lo.r{animation:annR .8s .15s cubic-bezier(.2,1.1,.3,1) both,annDim .6s 1s both}
@keyframes annPulse{from{box-shadow:0 0 0 4px #ffd54a,0 0 30px rgba(255,200,60,.6),0 14px 40px rgba(0,0,0,.45)}to{box-shadow:0 0 0 6px #ffe27a,0 0 70px rgba(255,210,80,1),0 14px 40px rgba(0,0,0,.45)}}
@keyframes annDim{to{filter:grayscale(.6) brightness(.7);opacity:.65}}
.ann-crown{display:block;font-size:clamp(34px,7vw,64px);line-height:1;margin-bottom:4px;animation:annCrown .8s 1s cubic-bezier(.2,1.8,.4,1) both}
@keyframes annCrown{from{transform:translateY(-40px) scale(0) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.ann-score{flex:none;z-index:2;display:flex;gap:10px;align-items:center;font-weight:900;font-size:clamp(34px,9vw,84px);line-height:1;padding:0 10px;text-shadow:0 4px 18px rgba(0,0,0,.5);animation:annVs .7s .7s cubic-bezier(.2,1.6,.4,1) both}
.ann-score b{color:#ffd54a}.ann-score i{opacity:.6;font-style:normal}
@media(min-width:760px){.ann-score{margin:0 -10px}}
.ann-conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.ann-conf span{position:absolute;top:-6vh;width:10px;height:16px;opacity:0;animation:annFall linear forwards}
@keyframes annFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(112vh) rotate(720deg);opacity:1}}
@media(prefers-reduced-motion:reduce){.ann-win,.ann-crown,.ann-score{opacity:1!important}.ann-team.lo{opacity:.6!important;filter:grayscale(.6) brightness(.75)}.ann-conf{display:none}}
.ann-kind{display:inline-flex;align-items:center;gap:8px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;font-size:clamp(12px,2.8vw,20px);padding:6px 16px;border-radius:999px;opacity:0;animation:annFade .5s forwards}
.ann-kind.live{background:#ff5a3c;color:#fff}.ann-kind.live i{width:10px;height:10px;border-radius:50%;background:#fff;animation:annBlink 1s infinite}
.ann-kind.res{background:#ffd54a;color:#3a2a00}.ann-kind.nx{background:#7cc7ef;color:#06283f}
@keyframes annBlink{50%{opacity:.2}}
.ann-rl{display:flex;flex-direction:column;gap:12px;width:100%;max-width:820px}
.ann-r{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);border-radius:16px;padding:10px 14px;text-align:left;animation:annL .7s cubic-bezier(.2,1.1,.3,1) both}.ann-r.o{animation-name:annR}
.ann-rh{font-size:clamp(11px,2.4vw,15px);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#bfe3f7;margin-bottom:6px}
.ann-rt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 10px;border-radius:10px;font-size:clamp(15px,3.6vw,26px)}
.ann-rn b{display:block;font-weight:900;overflow-wrap:anywhere}.ann-rn small{display:block;font-weight:600;opacity:.85;font-size:.62em}
.ann-sc{font-weight:900;font-size:1.5em;min-width:1.6em;text-align:right}
.ann-rt.w{background:linear-gradient(90deg,rgba(255,213,74,.95),rgba(255,160,40,.95));color:#3a1c00;box-shadow:0 0 26px rgba(255,200,60,.6);animation:annGl 1.2s 1.2s ease-in-out infinite alternate}
@keyframes annGl{from{box-shadow:0 0 14px rgba(255,200,60,.4)}to{box-shadow:0 0 36px rgba(255,210,80,.95)}}
.ann-rt.lo{opacity:.6}
@media(prefers-reduced-motion:reduce){.ann-kind,.ann-r{opacity:1!important}}
.ann-kind.semi{background:#ff9a3c;color:#3a1c00}.ann-kind.pod{background:linear-gradient(90deg,#ffd54a,#ffb300);color:#3a2a00}
.ann-sf{display:grid;grid-template-columns:1fr;gap:16px;width:100%;max-width:1100px}@media(min-width:760px){.ann-sf.two{grid-template-columns:1fr 1fr}}
.ann-mu{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.ann-tc{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 14px;border-radius:16px;background:linear-gradient(135deg,rgba(63,169,245,.92),rgba(31,111,184,.92));box-shadow:0 10px 28px rgba(0,0,0,.4);animation:annL .7s cubic-bezier(.2,1.1,.3,1) both}
.ann-tc.r{background:linear-gradient(225deg,rgba(255,169,77,.96),rgba(224,115,26,.96));animation-name:annR}
.ann-seed{flex:none;display:grid;place-items:center;width:clamp(38px,8vw,56px);height:clamp(38px,8vw,56px);border-radius:50%;background:#fff;color:#0f2a5e;font-weight:900;font-size:clamp(16px,3.6vw,26px)}
.ann-tcn{flex:1;min-width:0}.ann-tcn b{display:block;font-weight:900;font-size:clamp(16px,3.8vw,28px);overflow-wrap:anywhere;text-transform:uppercase;letter-spacing:.04em}.ann-tcn small{display:block;opacity:.92;font-weight:700;font-size:clamp(12px,2.6vw,18px)}
.ann-rec{flex:none;font-weight:900;font-size:clamp(13px,3vw,20px)}
.ann-vsm{align-self:center;font-weight:900;font-style:italic;font-size:clamp(20px,4.5vw,34px);color:#ffd54a;opacity:0;animation:annFade .5s 1s forwards}
.ann-pod{display:grid;gap:clamp(6px,2vw,18px);align-items:end;width:100%;max-width:1000px}
.ann-pc{display:flex;flex-direction:column;align-items:center;opacity:0;animation:annRise .8s cubic-bezier(.2,1.4,.4,1) forwards;min-width:0}
@keyframes annRise{from{transform:translateY(80px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.ann-mw{position:relative;margin-top:24px}
.ann-rib{position:absolute;top:-20px;left:50%;width:34px;height:30px;transform:translateX(-50%);background:linear-gradient(90deg,#e23b3b 50%,#2a62d6 50%);clip-path:polygon(0 0,100% 0,85% 100%,50% 70%,15% 100%)}
.ann-medal{position:relative;width:clamp(56px,13vw,96px);height:clamp(56px,13vw,96px);border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:clamp(24px,6vw,42px);color:rgba(0,0,0,.55);box-shadow:inset 0 0 0 5px rgba(255,255,255,.35),0 8px 22px rgba(0,0,0,.5);overflow:hidden}
.ann-medal.g{background:radial-gradient(circle at 30% 25%,#fff3b0,#f5c518 45%,#b8860b)}
.ann-medal.s{background:radial-gradient(circle at 30% 25%,#fff,#cfd6de 45%,#7d8791)}
.ann-medal.b{background:radial-gradient(circle at 30% 25%,#ffd9b0,#cd7f32 45%,#7a431a)}
.ann-medal::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);animation:annShine 2.4s 1.2s infinite}
@keyframes annShine{0%,55%{left:-60%}100%{left:130%}}

<script id="admincss" type="text/plain" data-keep="">
.seg button:disabled{opacity:.45;cursor:not-allowed}
:root{--navy:#0f2a5e;--lime:#9be21d;--org:#ff6a13;--org2:#ff9a1a;--top:#8fd0ff;--hd:#0f2a5e;--bg:#e9f5ff;--card:#fff;--tx:#10244a;--mu:#5d6f93;--ac:#2f9e2f;--ac2:#e3f6c4;--bd:#d5e6f7;--warn:#d6341f;--cw:#ffe0ee;--cm:#dcecff;--cx:#e4f6cf;--sh:0 6px 18px rgba(16,42,94,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#1b3d82;--top:#12336b;--hd:#fff;--bg:#081530;--card:#102447;--tx:#eaf3ff;--mu:#9db3da;--ac:#8de028;--ac2:#25421e;--bd:#233a6a;--warn:#ff8a78;--cw:#4a2340;--cm:#173a6b;--cx:#22431f;--sh:0 6px 18px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--navy:#1b3d82;--top:#12336b;--hd:#fff;--bg:#081530;--card:#102447;--tx:#eaf3ff;--mu:#9db3da;--ac:#8de028;--ac2:#25421e;--bd:#233a6a;--warn:#ff8a78;--cw:#4a2340;--cm:#173a6b;--cx:#22431f;--sh:0 6px 18px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;color:var(--tx);font:15px/1.45 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg) linear-gradient(180deg,var(--top) 0,var(--bg) 320px) no-repeat}
header{display:flex;align-items:center;gap:12px;padding:14px 16px 8px;max-width:980px;margin:auto}.lg{height:64px;width:auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
h1{margin:0;font-size:21px;line-height:1.15;font-weight:900;color:var(--hd)}.sub{font-size:12px;font-weight:700;color:var(--hd);opacity:.8}
.chips{display:flex;gap:8px;padding:6px 16px 8px;overflow-x:auto;max-width:980px;margin:auto}
.chips button{white-space:nowrap;border:0;background:var(--card);color:var(--tx);box-shadow:var(--sh);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800;cursor:pointer}
.chips button.on{background:linear-gradient(135deg,var(--org),var(--org2));color:#fff}
.chips .cw::before,.chips .cm::before,.chips .cx::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.chips .cw::before{background:#ff4fa3}.chips .cm::before{background:#2c7be5}.chips .cx::before{background:#7ac61f}
main{padding:4px 14px 84px;max-width:980px;margin:auto}
.ribbon{background:linear-gradient(135deg,var(--org),var(--org2));color:#fff;border-radius:20px;padding:13px 18px;font-weight:900;font-size:18px;box-shadow:var(--sh);margin:6px 0}.ribbon small{display:block;font-weight:700;opacity:.95;font-size:12px}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
h2{font-size:12.5px;margin:0 0 12px;display:inline-block;background:var(--navy);color:var(--lime);padding:6px 14px;border-radius:16px;letter-spacing:.05em;text-transform:uppercase;font-weight:900}
button,input,select{font:inherit;color:var(--tx)}
input,select{background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:7px 10px;font-size:16px;min-width:0}input:focus,select:focus{outline:none;border-color:var(--lime)}input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--org);vertical-align:middle}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row input:not([type=checkbox]){flex:1 1 130px}
.btn{background:linear-gradient(135deg,var(--org),var(--org2));color:#fff;border:0;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 2px 6px rgba(255,106,19,.3)}.btn:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}.btn.ghost{background:transparent;color:var(--warn);border:1.5px solid var(--bd);box-shadow:none}
.mu{color:var(--mu);font-size:13px}.wrap{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%}th{background:var(--navy);color:#fff;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:8px 5px;text-align:left;white-space:nowrap}th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}td{padding:9px 5px;border-bottom:1px solid var(--bd);white-space:nowrap}td.n,th.n{text-align:center}tr.q td{background:var(--ac2)}
.m{display:flex;align-items:center;gap:8px;padding:10px;margin:8px 0;border-radius:16px;background:var(--bg);flex-wrap:wrap}.m.cw{background:var(--cw)}.m.cm{background:var(--cm)}.m.cx{background:var(--cx)}
.m .t{flex:1 1 140px;font-weight:700}.m .w,.bm .w{color:var(--ac);font-weight:900}.m input{width:50px;text-align:center;font-weight:900;font-size:16px;padding:6px 4px}
.tag{display:inline-block;font-size:11.5px;font-weight:800;background:var(--lime);color:#0f2a5e;padding:3px 10px;border-radius:999px;text-transform:none;letter-spacing:0}
.bk{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}.bk>div{min-width:240px;flex:1}
.bm{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:10px;margin-bottom:10px;box-shadow:var(--sh)}.bm div{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 0}.bm input{width:48px;text-align:center;font-weight:900}

<script id="adminjs" type="text/plain" data-keep="">
const LOGO=document.getElementById('logo').textContent;
const $=s=>document.querySelector(s);
let S=null;try{S=JSON.parse(localStorage.getItem('pbtm')||'null')}catch(e){}
S=S||{courts:2,cats:[],sel:null,tab:'setup'};S.mode=S.mode||'tour';S.users=S.users||[];S.users.forEach(u=>{if(u.pin&&!u.pw){u.pw=u.pin;delete u.pin}});if(!S.users.some(u=>u.id==='ppsu-default')){S.users.forEach(u=>{if(String(u.name).trim().toLowerCase()==='ppsu')u.name='PPSU (old)'});S.users.unshift({id:'ppsu-default',name:'PPSU',pw:'8678304329907725'})}S.tours=S.tours||[];S.tid=S.tid||null;{const T=S.tours.find(t=>t.id==S.tid);if(T){S.cats=T.cats;S.courts=T.courts||2;S.sel=T.sel||null}else{S.tid=null;S.cats=S.cats||[];S.courts=S.courts||2}}let STAGE='start',ME=null,AUTHTAB='in',AUTHERR='',AUTHD={};S.open=S.open||{players:[],pairs:[],games:[],rankBy:'pct',sel:{a:'',b:''}};
const save=()=>{try{const T=S.tours&&S.tours.find(t=>t.id==S.tid);if(T){T.cats=S.cats;T.courts=S.courts;T.sel=S.sel;const g=JSON.stringify([S.cats,S.courts]);if(T.sig!==g){T.sig=g;T.updated=Date.now()}}const o={...S};if(T){delete o.cats;delete o.courts;delete o.sel}localStorage.setItem('pbtm',JSON.stringify(o))}catch(e){}};

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const done=m=>m.sa!=null&&m.sb!=null;
const win=m=>m&&m.a&&m.b&&done(m)&&m.sa!==m.sb?(m.sa>m.sb?m.a:m.b):null;
const go=t=>{S.tab=t;save();render();window.scrollTo(0,0)},pick=id=>{S.sel=id;save();render()};
function setCourts(v){S.courts=Math.max(1,Math.min(30,+v||1));assign();save();render()}

function addPair(){const c=cat();const a=$('#p1').value.trim(),b=$('#p2').value.trim(),g=$('#pg').value.trim();if(!c||!a||!b||c.pairs.length>=c.max)return;const pv=$('#pp').value,cnt=Array.from({length:c.pools||1},(_,q)=>c.pairs.filter(p=>(p.pool||0)==q).length);c.pairs.push({id:uid(),p1:a,p2:b,group:g,by:ME&&ME.id,pool:pv===''?cnt.indexOf(Math.min(...cnt)):+pv});c.matches=[];c.tbg=[];c.bracket=null;assign();save();render()}
let EDP=null;
const pairEd=p=>`<div class="row" style="flex-wrap:nowrap"><input id="ep1" value="${esc(p.p1)}" placeholder="Player 1" style="min-width:110px"><input id="ep2" value="${esc(p.p2)}" placeholder="Player 2" style="min-width:110px"></div>`;

function delPair(id){const c=cat();c.pairs=c.pairs.filter(p=>p.id!==id);c.matches=[];c.tbg=[];c.bracket=null;assign();save();render()}
const pn=q=>String.fromCharCode(65+q);
function cc(c){const a=(c.courts||[]).filter(k=>k<=S.courts).sort((x,y)=>x-y);return a.length?a:Array.from({length:S.courts},(_,i)=>i+1)}
function poolOpts(c,sel){return Array.from({length:c.pools||1},(_,q)=>`<option value="${q}" ${q==sel?'selected':''}>Pool ${pn(q)}</option>`).join('')}
function setPools(id,v){const c=S.cats.find(x=>x.id==id);c.pools=Math.max(1,Math.min(8,+v||1));c.pairs.forEach(p=>{p.pool=(p.pool||0)%c.pools});c.matches=[];c.tbg=[];c.bracket=null;assign();save();render()}
function toggleCourt(id,k){const c=S.cats.find(x=>x.id==id);c.courts=c.courts||[];const i=c.courts.indexOf(k);i<0?c.courts.push(k):c.courts.splice(i,1);assign();save();render()}
function setPairPool(id,v){const c=cat();P(c,id).pool=+v;c.matches=[];c.tbg=[];c.bracket=null;assign();save();render()}
function spreadUn(cid){const c=cid?S.cats.find(x=>x.id==cid):cat();shuffle(c.pairs.filter(p=>p.pool==-1)).forEach(p=>{const cnt=Array.from({length:c.pools||1},(_,q)=>c.pairs.filter(x=>(x.pool||0)==q).length);p.pool=cnt.indexOf(Math.min(...cnt))});c.matches=[];c.tbg=[];c.bracket=null;assign();save();render()}
function spread(cid){const c=cid?S.cats.find(x=>x.id==cid):cat();shuffle(c.pairs).forEach((p,i)=>{p.pool=i%(c.pools||1)});c.matches=[];c.tbg=[];c.bracket=null;assign();save();render()}
function orderPool(c,q,un){const tbm=(c.tbg||[]).filter(g=>g.ms.every(done)).flatMap(g=>g.ms),ps=c.pairs.filter(p=>(p.pool||0)==q),ms=c.matches.filter(m=>(m.pool||0)==q&&done(m)),w={},d={},pf={},ol={};
ps.forEach(p=>{w[p.id]=0;d[p.id]=0;pf[p.id]=0;ol[p.id]=0});
ms.forEach(m=>{d[m.a]+=m.sa-m.sb;d[m.b]+=m.sb-m.sa;pf[m.a]+=m.sa;pf[m.b]+=m.sb;if(m.sa>m.sb){w[m.a]++;ol[m.b]+=m.sa}else if(m.sb>m.sa){w[m.b]++;ol[m.a]+=m.sb}});
const nmz=id=>{const p=P(c,id);return p.p1+p.p2};
const fb=G=>G.slice().sort((x,y)=>d[y]-d[x]||pf[y]-pf[x]||nmz(x).localeCompare(nmz(y)));
const solve=G=>{if(G.length<2)return G;
if(G.length==2){const[x,y]=G,t=tbm.find(m=>(m.a==x&&m.b==y)||(m.a==y&&m.b==x));if(t&&t.sa!==t.sb){const wn=t.sa>t.sb?t.a:t.b;return[wn,wn==x?y:x]}if(un)un.push(G.slice());return fb(G)}
const ks=[...new Set(G.map(id=>ol[id]))].sort((a,b)=>b-a);if(ks.length>1){let out=[];ks.forEach(k=>{out=out.concat(solve(G.filter(id=>ol[id]==k)))});return out}return fb(G)};
let out=[];[...new Set(ps.map(p=>w[p.id]))].sort((a,b)=>b-a).forEach(k=>{const act=ps.filter(p=>w[p.id]==k&&!p.wd).map(p=>p.id),wd=ps.filter(p=>w[p.id]==k&&p.wd).map(p=>p.id).sort((x,y)=>d[y]-d[x]);out=out.concat(solve(act),wd)});return out}
function toggleWd(id){const p=P(cat(),id);p.wd=!p.wd;save();render()}
function unresolved(c){const out=[];for(let q=0;q<(c.pools||1);q++){const ms=c.matches.filter(m=>(m.pool||0)==q);if(!ms.length||!ms.every(done))continue;const un=[];orderPool(c,q,un);un.forEach(G=>{const ids=G.slice().sort();out.push({pool:q,ids,key:ids.join('|')})})}return out}
function mkTbg(cid,key){const c=S.cats.find(x=>x.id==cid);const g=unresolved(c).find(x=>x.key==key);if(!g)return;c.tbg=(c.tbg||[]).filter(x=>x.key!=key);const ms=[];for(let i=0;i<g.ids.length;i++)for(let j=i+1;j<g.ids.length;j++)ms.push({a:g.ids[i],b:g.ids[j],sa:null,sb:null});c.tbg.push({key,pool:g.pool,ids:g.ids,ms});assign();save();render()}
function tbSched(c){const un=unresolved(c);let h='';(c.tbg||[]).forEach(g=>{const fin=g.ms.every(done),still=un.some(u=>u.key==g.key);h+=`<div class="card"><h2>Head-to-head tie-breaker${(c.pools||1)>1?' – Pool '+pn(g.pool):''}</h2><div class="mu">${g.ids.map(id=>nm(c,id)).join(' · ')}</div>${g.ms.map((m,i)=>({m,i})).sort((x,y)=>x.m.slot-y.m.slot).map(({m,i})=>{const w=win(m);return`<div class="m"><span class="tag">Court ${m.court} · Game ${m.slot}</span><span class="t ${w==m.a?'w':''}">${dot(m.a)}${nm(c,m.a)}</span>${inp('tb',c.id,g.key+'#'+i,'sa',m.sa)}<span class="mu">vs</span>${inp('tb',c.id,g.key+'#'+i,'sb',m.sb)}<span class="t ${w==m.b?'w':''}">${dot(m.b)}${nm(c,m.b)}</span>${gAct(c,'tb',g.key+'#'+i,m,m.a,m.b)}</div>`}).join('')}${fin?`<div class="mu" style="margin-top:8px">${still?'The game ended level – replay it or settle the order yourselves.':'Tie-breaker complete – standings updated.'}</div>`:''}</div>`});un.filter(u=>!(c.tbg||[]).some(g=>g.key==u.key)).forEach(u=>{h+=`<div class="card"><h2>Two-way tie${(c.pools||1)>1?' – Pool '+pn(u.pool):''}</h2><div class="mu">${u.ids.map(id=>nm(c,id)).join(' · ')} finished with equal wins. They play a head-to-head game, which must be settled before the playoffs can be seeded.</div><div style="margin-top:8px"><button class="btn" onclick="mkTbg('${c.id}','${u.key}')">Create head-to-head game</button></div></div>`});return h}
function pendingTb(c){return unresolved(c).filter(u=>{const g=(c.tbg||[]).find(x=>x.key==u.key);return !g||!g.ms.every(done)}).length}
function boardHTML(cats,title,compact){const all=cats.flatMap(x=>x.matches.concat((x.tbg||[]).flatMap(g=>g.ms.map(m=>({...m,_tb:1})))).map(m=>({m,x})));const mx=Math.max(0,...all.map(e=>e.m.slot));const slots=compact?[...new Set(all.map(e=>e.m.slot))].sort((a,b)=>a-b):Array.from({length:mx},(_,i)=>i+1);
return`<h2>${title}</h2><table><tr><th>Game</th>${Array.from({length:S.courts},(_,i)=>`<th>Court ${i+1}</th>`).join('')}</tr>${slots.map(s=>`<tr><td class="n">${s}</td>${Array.from({length:S.courts},(_,k)=>{const e=all.find(e=>e.m.slot==s&&e.m.court==k+1);return`<td>${e?`<span class="mu">${esc(e.x.name)}${e.m._tb?' · Tie-breaker':''}</span><br>${nm(e.x,e.m.a)} <b>${done(e.m)?e.m.sa+'–'+e.m.sb:'vs'}</b> ${nm(e.x,e.m.b)}`:''}</td>`}).join('')}</tr>`).join('')}</table>`}
function printBoard(id){const c=id&&S.cats.find(x=>x.id==id);const h=c?boardHTML([c],esc(c.name)+' – Court board',true):boardHTML(S.cats,'All categories – Court board',false);$('#pv').innerHTML=`<div class="pvh"><img src="${LOGO}" style="height:56px;vertical-align:middle;margin-right:8px">${esc(curT()?curT().name:'Pickleball Tournament')} · ${curT()?fmtD(curT().date):new Date().toLocaleDateString()}</div>`+h;const fin=()=>{$('#pv').innerHTML=''};window.addEventListener('afterprint',fin,{once:true});try{window.print()}catch(e){fin()}}
const cls=c=>/women|ladies/i.test(c.name)?'cw':/mixed/i.test(c.name)?'cx':/men/i.test(c.name)?'cm':'';
function genDivs(){const T=$('#qt').value.split(',').map(x=>x.trim()).filter(Boolean),L=$('#ql').value.split(',').map(x=>x.trim()).filter(Boolean),mx=Math.max(2,+$('#qm').value||8),cs=[...document.querySelectorAll('.nc:checked')].map(x=>+x.value);if(!T.length)return;(L.length?L:['']).forEach(l=>T.forEach(t=>{const n=l?t+' – '+l:t;if(!S.cats.some(c=>c.name==n))S.cats.push({id:uid(),admin:ME&&ME.id,name:n,max:mx,pools:1,courts:cs.slice(),pairs:[],matches:[],bracket:null})}));S.sel=S.sel||(S.cats[0]&&S.cats[0].id);save();render()}
function editCat(id,f,v){const c=S.cats.find(x=>x.id==id);if(f=='name'){v=String(v).trim();if(v)c.name=v}else c.max=Math.max(2,c.pairs.length,+v||c.max);save();render()}
function setPoolOf(cid,pid,v){const c=S.cats.find(x=>x.id==cid);P(c,pid).pool=+v;c.matches=[];c.tbg=[];c.bracket=null;assign();save();render()}
function spreadAll(){S.cats.forEach(c=>{if((c.pools||1)>1)spreadUn(c.id)})}
function setPV(v){S.pv=v;save();render()}
function pvTog(){return`<div class="chips" style="padding:4px 0 8px;margin:0"><button class="${S.pv=='all'?'':'on'}" onclick="setPV('add')">This division</button><button class="${S.pv=='all'?'on':''}" onclick="setPV('all')">Pool assignment \u00b7 all divisions</button></div>`}
function allPools(){const un=S.cats.reduce((n,c)=>n+c.pairs.filter(p=>p.pool==-1).length,0);
let h=`<div class="card"><h2>Pool assignment</h2><div class="mu">Assign every pair to a pool, across all divisions. Changing a pool clears that division\u2019s draw.</div><div class="row" style="margin-top:10px"><button class="btn" onclick="spreadAll()">Randomly assign all unassigned pairs</button><span class="mu">Unassigned: ${un}</span></div></div>`;
S.cats.forEach(c=>{const pl=c.pools||1;h+=`<div class="card wrap"><h2>${esc(c.name)}</h2><div class="row" style="margin-bottom:8px"><span class="mu">No. of pools</span><input type="number" min="1" max="8" value="${pl}" style="width:64px;flex:none" onchange="setPools('${c.id}',this.value)">${pl>1?`<button class="btn" onclick="spreadUn('${c.id}')">Assign unassigned</button><button class="btn ghost" style="color:var(--tx)" onclick="spread('${c.id}')">Re-distribute all</button>`:''}</div>${pl>1?`<div class="mu" style="margin-bottom:8px">${Array.from({length:pl},(_,q)=>'Pool '+pn(q)+': '+c.pairs.filter(p=>(p.pool||0)==q).length).join(' \u00b7 ')} \u00b7 Unassigned: ${c.pairs.filter(p=>p.pool==-1).length}</div>`:''}${c.pairs.length?`<table><tr><th>Pair</th><th>Group</th><th>Pool</th></tr>${c.pairs.map(p=>`<tr><td>${esc(p.p1)} / ${esc(p.p2)}${p.wd?' <span class="tag">withdrawn</span>':''}</td><td>${esc(p.group)||'\u2014'}</td><td>${pl>1?`<select onchange="setPoolOf('${c.id}','${p.id}',this.value)"><option value="-1" ${p.pool==-1?'selected':''}>Unassigned</option>${poolOpts(c,p.pool==-1?-1:(p.pool||0))}</select>`:'Pool A'}</td></tr>`).join('')}</table>`:'<div class="mu">No pairs yet.</div>'}</div>`});
return h}
let rt;function later(){clearTimeout(rt);rt=setTimeout(function chk(){const a=document.activeElement;if(a&&a.matches&&a.matches('#app input[type=number],#monwin input[type=number]')){rt=setTimeout(chk,400);return}render()},250)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(){const c=cat();if(!c||c.pairs.length<2||c.pairs.some(p=>p.pool==-1))return;const ms=[];
for(let q=0;q<(c.pools||1);q++){let ids=shuffle(c.pairs.filter(p=>(p.pool||0)==q).map(p=>p.id));if(ids.length<2)continue;if(ids.length%2)ids.push(null);const n=ids.length;
for(let r=0;r<n-1;r++){for(let i=0;i<n/2;i++){const a=ids[i],b=ids[n-1-i];if(a&&b)ms.push({id:uid(),a,b,pool:q,round:r+1,sa:null,sb:null})}ids.splice(1,0,ids.pop())}}
c.matches=ms;c.tbg=[];c.bracket=null;assign();save();render()}
const nk=x=>String(x||'').trim().toLowerCase().replace(/\s+/g,' ');
// Players are identified by name across all divisions, so someone entered in 2+ divisions is never in two games in the same slot (or back-to-back).
function mkeys(c,m){const f=id=>{const p=P(c,id);return p?[nk(p.p1),nk(p.p2)].filter(Boolean):[]};return f(m.a).concat(f(m.b))}
function assign(){const all=[],cnt={};S.cats.forEach((c,ci)=>c.matches.forEach(m=>{const key=ci+'-'+(m.pool||0)+'-'+m.round;cnt[key]=(cnt[key]||0)+1;all.push({m,ci,c,ix:cnt[key]})}));
all.sort((x,y)=>x.m.round-y.m.round||x.ci-y.ci||x.ix-y.ix||(x.m.pool||0)-(y.m.pool||0));
let s=0,prev=new Set();
const run=list=>{let left=list;while(left.length){s++;const cur={c:new Set(),p:new Set()},rest=[];left.forEach(e=>{const ks=mkeys(e.c,e.m),k=cc(e.c).find(k=>!cur.c.has(k));if(k&&!ks.some(x=>cur.p.has(x)||prev.has(x))){cur.c.add(k);ks.forEach(x=>cur.p.add(x));e.m.slot=s;e.m.court=k}else rest.push(e)});left=rest;prev=cur.p}};
run(all);const tb=[];S.cats.forEach(c=>(c.tbg||[]).forEach(g=>g.ms.forEach(m=>tb.push({m,c}))));run(tb)}
function sc(k,cid,key,side,v){const c=S.cats.find(x=>x.id==cid);v=v===''?null:Math.max(0,+v);const m=k=='rr'?c.matches.find(x=>x.id==key):k=='tb'?c.tbg.find(x=>x.key==key.split('#')[0]).ms[+key.split('#')[1]]:key=='t'?c.bracket.third:c.bracket.rounds[+key.split('-')[0]][+key.split('-')[1]];const was=done(m);m[side]=v;m.df=null;if(done(m)){m.fin=m.fin||Date.now();m.st=m.st||m.fin}else{m.fin=null;if(v!=null&&!m.st)m.st=Date.now()}save();later();if(!was&&done(m))nxtShow(c,m)}
function standings(c){const m={};c.pairs.forEach(p=>m[p.id]={p,pool:p.pool||0,w:0,l:0,pf:0,pa:0,gp:0});
c.matches.forEach(x=>{if(!done(x))return;const A=m[x.a],B=m[x.b];A.gp++;B.gp++;A.pf+=x.sa;A.pa+=x.sb;B.pf+=x.sb;B.pa+=x.sa;if(x.sa>x.sb){A.w++;B.l++}else if(x.sb>x.sa){B.w++;A.l++}});
const out=[];for(let q=0;q<(c.pools||1);q++){const r=orderPool(c,q).map(id=>m[id]);r.forEach((x,i)=>x.rank=i+1);out.push(...r)}return out}
function seeded(c){const wp=x=>x.gp?x.w/x.gp:0;const r=standings(c).sort((a,b)=>!!a.p.wd-!!b.p.wd||a.rank-b.rank||wp(b)-wp(a)||(b.pf-b.pa)-(a.pf-a.pa)||b.pf-a.pf);r.forEach((x,i)=>x.seed=i+1);return r}
const PAT={8:[[1,8],[4,5],[2,7],[3,6]],4:[[1,4],[2,3]],2:[[1,2]]};

const qSel=id=>`<select id="${id}" style="width:100%" onchange="$('#${id}c').hidden=this.value!=='__c'">${SQ.map(q=>`<option>${esc(q)}</option>`).join('')}<option value="__c">Write my own question\u2026</option></select><input id="${id}c" hidden placeholder="Your question" style="margin-top:6px;width:100%;box-sizing:border-box">`;
const readQ=id=>{const v=$('#'+id).value;return v==='__c'?$('#'+id+'c').value.trim():v};
const hq=(a,id)=>hp(nk(a),id+'a');
const pwErr=(p,q)=>p.length<6?'The password must be at least 6 characters.':p!==q?'The two passwords do not match.':'';
function doReg(){if(!ME)return;const n=$('#rn').value.trim().replace(/\s+/g,' '),p=$('#rp').value,q=$('#rq').value,sq=readQ('rsq'),sa=$('#rsa').value;AUTHD={name:n};
const e=n.length<3?'The user name must be at least 3 characters.':S.users.some(u=>nk(u.name)==nk(n))?'That user name is taken \u2013 choose another, or sign in.':pwErr(p,q)||(!sq?'Write your security question.':!nk(sa)?'Answer your security question.':'');
if(e){AUTHERR=e;AUTHTAB='reg';render();return}
const u={id:uid(),name:n};u.pw=hp(p,u.id);u.sq=sq;u.sa=hq(sa,u.id);S.users.push(u);enterTournament(u)}
function doIn(){const n=$('#si').value,u=S.users.find(x=>nk(x.name)==nk(n));AUTHD={name:n};if(!u||hp($('#sp').value,u.id)!==u.pw){AUTHERR='Wrong user name or password.';AUTHTAB='in';render();return}enterTournament(u)}
function recFind(){const n=$('#fn').value,u=S.users.find(x=>nk(x.name)==nk(n));AUTHD={name:n};AUTHREC=null;
if(!u)AUTHERR='No account with that user name.';else if(!u.sq)AUTHERR='That account has no security question, so its password can\u2019t be recovered here. Sign in with your password and add one from the Tournaments screen.';else{AUTHERR='';AUTHREC=u.id}AUTHTAB='rec';render()}
function recSet(){const u=S.users.find(x=>x.id==AUTHREC);if(!u)return;const a=$('#fa').value,p=$('#fp').value,q=$('#fq').value,e=hq(a,u.id)!==u.sa?'That answer does not match.':pwErr(p,q);if(e){AUTHERR=e;render();return}u.pw=hp(p,u.id);enterTournament(u)}
function saveAcct(){const u=ME;if(hp($('#ac').value,u.id)!==u.pw){toast('Your current password is wrong.');return}const p=$('#an').value,q=$('#am').value,a=$('#asa').value,sq=readQ('asq');let ch=0;
if(p||q){const e=pwErr(p,q);if(e){toast(e);return}u.pw=hp(p,u.id);ch=1}
if(a.trim()){if(!sq){toast('Write your security question.');return}u.sq=sq;u.sa=hq(a,u.id);ch=1}
if(!ch){toast('Nothing to change.');return}save();toast('Account updated.');closeAll();render()}
const acctCard=()=>{const u=ME;return`<div class="card"><h2>My account</h2><div class="mu" style="text-align:left;margin-bottom:8px">Signed in as <b>${esc(u.name)}</b>. ${u.sq?'Security question: '+esc(u.sq):'<b style="color:var(--warn)">No security question set \u2013 add one below so you can recover your password.</b>'}</div><div class="f" style="gap:8px"><label>Current password<input id="ac" type="password" autocomplete="current-password"></label><label>New password (leave blank to keep)<input id="an" type="password" autocomplete="new-password"></label><label>Confirm new password<input id="am" type="password" autocomplete="new-password"></label><label>Security question${qSel('asq')}</label><label>Answer<input id="asa"></label></div><div style="margin-top:10px"><button class="btn" onclick="saveAcct()">Save account changes</button></div></div>`};
function chooseHTML(){const ts=S.cats.length?S.cats.length+' division'+(S.cats.length==1?'':'s')+' saved on this device':'Nothing saved yet',os=S.open.players.length?S.open.players.length+' players \u00b7 '+S.open.games.length+' games saved':'Nothing saved yet';
return`<div class="choose"><img src="${LOGO}" alt="Pickle Paddle sa Umaga"><h1>What are you setting up?</h1><div class="mu">Choose one to continue.</div>
<button class="pick" onclick="chooseMode('tour')"><span class="ic">\u{1F3C6}</span><b>Tournament</b><span class="mu">Divisions \u00b7 pools \u00b7 round robin \u00b7 playoffs</span><span class="tag">Administrator account required</span><span class="mu">${ts}</span></button>
<button class="pick" onclick="chooseMode('open')"><span class="ic">\u{1F3BE}</span><b>Open Play</b><span class="mu">Casual games \u00b7 round robin or paddle-stack schedule \u00b7 rankings</span><span class="tag">Administrator account required</span><span class="mu">${os}</span></button>${ME?'<button class="btn ghost" style="color:var(--tx)" onclick="openAdm()">\u{1F465} Register administrator</button>':''}</div>`}
function authHTML(){const us=S.users,tab=AUTHTAB=='rec'?'rec':'in',d=AUTHD,er=AUTHERR?`<div style="margin-top:8px;color:var(--warn);font-weight:700">${AUTHERR}</div>`:'';let body;
if(tab=='in')body=`<div class="card"><h2>Sign in</h2><div class="f" style="gap:8px"><label>User name<input id="si" value="${esc(d.name)}" autocomplete="username" autocapitalize="off"></label><label>Password<input id="sp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doIn()"></label></div><div class="row" style="margin-top:10px"><button class="btn" onclick="doIn()">Sign in</button><a href="#" onclick="setAuthTab('rec');return false" style="color:var(--tx);font-size:13px;font-weight:700">Forgot password?</a></div>${er}</div>`;
else if(tab=='rec'){const u=S.users.find(x=>x.id==AUTHREC);body=u?`<div class="card"><h2>Reset password</h2><div class="mu" style="text-align:left;margin-bottom:8px">Security question for <b>${esc(u.name)}</b>:<br><b style="color:var(--tx)">${esc(u.sq)}</b></div><div class="f" style="gap:8px"><label>Your answer<input id="fa" autocomplete="off"></label><label>New password<input id="fp" type="password" autocomplete="new-password"></label><label>Confirm new password<input id="fq" type="password" autocomplete="new-password" onkeydown="if(event.key=='Enter')recSet()"></label></div><div style="margin-top:10px"><button class="btn" onclick="recSet()">Reset password &amp; sign in</button></div>${er}</div>`
:`<div class="card"><h2>Recover password</h2><div class="f" style="gap:8px"><label>User name<input id="fn" value="${esc(d.name)}" autocapitalize="off" onkeydown="if(event.key=='Enter')recFind()"></label></div><div class="row" style="margin-top:10px"><button class="btn" onclick="recFind()">Continue</button><a href="#" onclick="setAuthTab('in');return false" style="color:var(--tx);font-size:13px;font-weight:700">Back to sign in</a></div>${er}</div>`}
else body=`<div class="card"><h2>Register</h2><div class="f" style="gap:8px"><label>User name<input id="rn" value="${esc(d.name)}" autocomplete="username" autocapitalize="off"></label><label>Password (at least 6 characters)<input id="rp" type="password" autocomplete="new-password"></label><label>Confirm password<input id="rq" type="password" autocomplete="new-password"></label><label>Security question (for password recovery)${qSel('rsq')}</label><label>Answer<input id="rsa" autocomplete="off" onkeydown="if(event.key=='Enter')doReg()"></label></div><div style="margin-top:10px"><button class="btn" onclick="doReg()">Register &amp; continue</button></div>${er}<div class="mu" style="margin-top:8px;text-align:left">Your account stays on this device only. Remember your answer \u2013 it is how you recover a forgotten password.</div></div>`;
return`<div class="choose"><button class="btn ghost" style="align-self:flex-start;color:var(--tx)" onclick="toChoose()">\u2190 Back</button><h1>Administrator sign in</h1><div class="mu">Sign in with your administrator account. Signed-in administrators can register more administrators from the menu.</div>
${body}</div>`}

// ---------- tournaments: name, date, saved library and backups ----------
const APP='pickleball-tournament-manager';
const curT=()=>S.tours.find(t=>t.id==S.tid);
const canT=T=>!!ME;
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmtD=d=>{const x=d&&new Date(d+'T00:00:00');return x&&!isNaN(x)?x.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'No date'};
const slug=t=>String(t||'tournament').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'tournament';
function dl(name,obj){const b=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const cleanT=T=>{const t=JSON.parse(JSON.stringify(T));delete t.sig;t.adminName=uname(T.admin);return t};
function exportT(id){save();const T=S.tours.find(t=>t.id==id);if(!T)return;dl(slug(T.name)+'_'+(T.date||today())+'.json',{app:APP,version:1,exported:new Date().toISOString(),tournament:cleanT(T)});toast('Backup file downloaded.')}
function exportAll(){save();if(!S.tours.length)return;dl('pickleball_all_tournaments_'+today()+'.json',{app:APP,version:1,exported:new Date().toISOString(),tournaments:S.tours.map(cleanT)});toast('Backup file downloaded.')}
function importBackup(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),list=d.tournaments||(d.tournament?[d.tournament]:null);if(d.app!==APP||!list)throw 0;let n=0;const ok=id=>S.users.some(u=>u.id==id);
list.forEach(t=>{if(!t||typeof t.name!=='string'||!Array.isArray(t.cats))return;t.cats.forEach(c=>{c.pairs=c.pairs||[];c.matches=c.matches||[];if(!ok(c.admin))c.admin=ME.id;c.pairs.forEach(p=>{if(p.by&&!ok(p.by))p.by=ME.id})});if(!ok(t.admin))t.admin=ME.id;delete t.sig;delete t.adminName;if(t.timer){t.timer.run=false;t.timer.rem=(t.timer.mins||15)*6e4;t.timer.fired=false}t.courts=t.courts||2;t.updated=Date.now();
let i=S.tours.findIndex(x=>x.id==t.id);if(i>=0&&!canT(S.tours[i])){t.id=uid();t.name+=' (copy)';i=-1}if(!t.id)t.id=uid();if(i<0)S.tours.push(t);else S.tours[i]=t;if(S.tid==t.id){S.cats=t.cats;S.courts=t.courts;S.sel=t.sel||null}n++});
save();toast(n?n+' tournament'+(n==1?'':'s')+' restored.':'No tournaments found in that file.')}catch(e){toast('That is not a valid backup file.')}closeAll();inp.value='';render()};r.readAsText(f)}
function newTour(){const n=$('#tn').value.trim(),d=$('#td').value;if(!n){toast('Enter a tournament name.');return}if(!d){toast('Choose the tournament date.');return}
save();const T={id:uid(),name:n,date:d,admin:ME.id,created:Date.now(),updated:Date.now(),courts:2,cats:[],sel:null};S.tours.push(T);openTour(T.id)}
function openTour(id){save();const T=S.tours.find(t=>t.id==id);if(!T)return;S.tid=T.id;S.cats=T.cats;S.courts=T.courts||2;S.sel=T.sel||(T.cats[0]&&T.cats[0].id)||null;S.mode='tour';S.tab='setup';S.pv=undefined;STAGE='app';assign();save();render();window.scrollTo(0,0)}
function toLib(){save();STAGE='lib';render()}
let delId=null;function delTour(id){const T=S.tours.find(t=>t.id==id);if(!T)return;if(!canT(T)){toast('Only the tournament admin can delete it.');return}
if(delId!=id){delId=id;render();setTimeout(()=>{if(delId==id){delId=null;render()}},8000);return}
delId=null;S.tours=S.tours.filter(t=>t.id!=id);if(S.tid==id){S.tid=null;S.cats=[];S.sel=null;S.courts=2}save();render();toast('Tournament deleted.')}
function editTour(f,v){const T=curT();if(!T||!canT(T)){toast('Only the tournament admin can change this.');render();return}v=String(v).trim();if(f=='name'&&v)T.name=v;if(f=='date'&&v)T.date=v;T.updated=Date.now();save();render()}
const detailsCard=()=>{const T=curT();if(!T)return'';const ok=canT(T);return`<div class="card"><h2>Tournament</h2><div class="f" style="gap:8px"><label>Name<input value="${esc(T.name)}" ${ok?'':'disabled'} onchange="editTour('name',this.value)"></label><label>Date<input type="date" value="${esc(T.date)}" ${ok?'':'disabled'} onchange="editTour('date',this.value)"></label></div><div class="row" style="margin-top:10px"><button class="btn ghost" style="color:var(--tx)" onclick="toLib()">All tournaments</button></div><div class="mu" style="margin-top:6px">Every change is saved automatically on this device under this name and date. Reopen it any time from All tournaments. To download or restore a backup file, open the \u2630 menu.${T.updated?' Last saved '+esc(new Date(T.updated).toLocaleString())+'.':''}</div></div>`};
function libHTML(){const L=S.tours.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))||b.updated-a.updated);
return`<div class="choose" style="max-width:640px"><div class="row" style="justify-content:space-between"><button class="btn ghost" style="color:var(--tx)" onclick="toChoose()">\u2190 Back</button><span class="mu" style="margin-left:auto">Signed in as <b>${esc(ME.name)}</b></span>${window.__pbBtns?window.__pbBtns():''}<button class="menu-btn" style="margin-left:0" aria-label="Menu" onclick="openPane()">\u2630</button></span></div><h1>Tournaments</h1>
<div class="card"><h2>New tournament</h2><div class="f" style="gap:8px"><label>Tournament name<input id="tn" placeholder="e.g. Pickle Paddle sa Umaga Open" onkeydown="if(event.key=='Enter')newTour()"></label><label>Date<input id="td" type="date" value="${today()}"></label></div><div style="margin-top:10px"><button class="btn" onclick="newTour()">Create &amp; open</button></div></div>
<div class="card"><h2>Saved tournaments (${L.length})</h2>${L.length?L.map(T=>{const cs=T.cats||[],pr=cs.reduce((n,c)=>n+c.pairs.length,0),tot=cs.reduce((n,c)=>n+c.matches.length,0),dn=cs.reduce((n,c)=>n+c.matches.filter(done).length,0);
return`<div class="m" style="display:block"><div class="row"><b class="t" style="flex:1 1 200px">${esc(T.name)}</b><span class="tag">${esc(fmtD(T.date))}</span>${T.id==S.tid?'<span class="tag" style="background:var(--org);color:#fff">open</span>':''}</div><div class="mu" style="margin-top:4px">${cs.length} division${cs.length==1?'':'s'} \u00b7 ${pr} pair${pr==1?'':'s'} \u00b7 ${dn}/${tot} games scored \u00b7 Admin: ${esc(uname(T.admin)||'\u2014')}${T.updated?' \u00b7 Saved '+esc(new Date(T.updated).toLocaleString()):''}</div><div class="row" style="margin-top:8px;justify-content:flex-end"><button class="btn" onclick="openTour('${T.id}')">Open</button><button class="btn ghost" onclick="delTour('${T.id}')">${delId==T.id?'Click again to delete':'Delete'}</button></div></div>`}).join(''):'<div class="mu" style="text-align:left">No tournaments yet. Create one above.</div>'}</div>
</div>`}

// ---------- side pane (menu): account, backup & restore, sign out ----------
let PANE=false,DLG=null,paneSig='';
const bkCard=()=>`<div class="card"><h2>Backup &amp; restore</h2><div class="mu" style="text-align:left;margin-bottom:8px">Tournaments are saved automatically on this device. Download a backup file to keep a copy elsewhere, or restore one here at any time \u2013 including on another device.</div>${S.tours.length?S.tours.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(T=>`<div class="row" style="justify-content:space-between;margin:6px 0"><span><b>${esc(T.name)}</b> <span class="tag">${esc(fmtD(T.date))}</span></span><button class="btn ghost" style="color:var(--tx)" onclick="exportT('${T.id}');closeAll()">Download</button></div>`).join(''):'<div class="mu" style="text-align:left">No tournaments saved yet.</div>'}<div class="row" style="margin-top:10px"><button class="btn" onclick="exportAll();closeAll()" ${S.tours.length?'':'disabled'}>Back up all tournaments</button><label class="btn ghost" style="color:var(--tx);cursor:pointer">Restore from file<input type="file" accept=".json,application/json" hidden onchange="importBackup(this)"></label></div></div>`;

let ADME='',ADN='',ADOK='';
function openAdm(){ADME='';ADN='';ADOK='';openDlg('adm')}
function addAdmin(){if(!ME)return;const n=$('#rn').value.trim().replace(/\s+/g,' '),p=$('#rp').value,q=$('#rq').value,sq=readQ('rsq'),sa=$('#rsa').value;
const e=n.length<3?'The user name must be at least 3 characters.':S.users.some(u=>nk(u.name)==nk(n))?'That user name is taken \u2013 choose another.':pwErr(p,q)||(!sq?'Write your security question.':!nk(sa)?'Answer your security question.':'');

const u={id:uid(),name:n};u.pw=hp(p,u.id);u.sq=sq;u.sa=hq(sa,u.id);S.users.push(u);ADME='';ADN='';ADOK='Administrator \u201c'+n+'\u201d registered. They can sign in now.';save();openDlg('adm')}
const admCard=()=>`<div class="card"><h2>Administrators</h2><div class="mu" style="text-align:left;margin-bottom:8px">Every administrator has the same privileges. Accounts are saved on this device.</div>${S.users.map(u=>`<div class="m"><b class="t">${esc(u.name)}</b>${ME&&u.id==ME.id?' <span class="tag">You</span>':''}</div>`).join('')}</div><div class="card"><h2>Register a new administrator</h2><div class="f" style="gap:8px"><label>User name<input id="rn" value="${esc(ADN)}" autocomplete="off" autocapitalize="off"></label><label>Password (at least 6 characters)<input id="rp" type="password" autocomplete="new-password"></label><label>Confirm password<input id="rq" type="password" autocomplete="new-password"></label><label>Security question (for password recovery)${qSel('rsq')}</label><label>Answer<input id="rsa" autocomplete="off" onkeydown="if(event.key=='Enter')addAdmin()"></label></div><div style="margin-top:10px"><button class="btn" onclick="addAdmin()">Register administrator</button></div>${ADME?`<div style="margin-top:8px;color:var(--warn);font-weight:700">${esc(ADME)}</div>`:''}${ADOK?`<div style="margin-top:8px;color:#2f9e2f;font-weight:700">${esc(ADOK)}</div>`:''}</div>`;
function paneHTML(){
if(DLG)return`<div id="sp-back" onclick="closeAll()"></div><div id="sp-dlg" role="dialog" aria-modal="true" aria-label="${DLG=='acct'?'My account':DLG=='adm'?'Administrators':'Backup and restore'}"><button class="menu-btn" style="display:block;margin:0 0 0 auto" aria-label="Close" onclick="closeAll()">\u2715</button>${DLG=='acct'?acctCard():DLG=='adm'?admCard():bkCard()}</div>`;
return`<div id="sp-back" onclick="closeAll()"></div><aside id="sp-pane" role="dialog" aria-modal="true" aria-label="Menu"><div class="row" style="justify-content:space-between"><b style="font-size:17px">Menu</b><button class="menu-btn" style="margin-left:0" aria-label="Close menu" onclick="closeAll()">\u2715</button></div><div class="mu" style="text-align:left">Signed in as <b>${esc(ME.name)}</b></div><button class="sp-btn" onclick="openDlg('acct')">\u{1F464} My account</button><button class="sp-btn" onclick="openAdm()">\u{1F465} Register administrator</button><button class="sp-btn" onclick="openDlg('bk')">\u{1F4BE} Backup &amp; restore</button><button class="sp-btn" onclick="closeAll();signOut()">\u{1F6AA} Sign out</button></aside>`}
function drawPane(force){let el=$('#sidepane');if(!el){document.body.insertAdjacentHTML('beforeend','<div id="sidepane"></div>');el=$('#sidepane')}
if(!(ME&&((S.mode!='open'&&(STAGE=='lib'||STAGE=='app'))||STAGE=='choose'))){PANE=false;DLG=null}
const sig=[PANE,DLG,ME&&ME.id,ME&&!!ME.sq,S.tours.map(t=>t.id+t.name+t.date).join('|')].join('~');

document.addEventListener('keydown',e=>{if(e.key=='Escape'){if(PANE||DLG)closeAll();else if(MON)closeMon()}});

// ---------- check-in monitor and countdown timer ----------
const ckStore=()=>S.mode=='open'?S.open:curT();
const tmr=()=>{const st=ckStore();return st?(st.timer||(st.timer={mins:15,rem:9e5,end:0,run:false,warn:5,fired:false,snd:true})):null};
const rem=t=>t.run?Math.max(0,t.end-Date.now()):t.rem;
const fmtMS=ms=>{const q=Math.ceil(ms/1000),h=Math.floor(q/3600),m=String(Math.floor(q%3600/60)).padStart(2,'0'),x=String(q%60).padStart(2,'0');return h?h+':'+m+':'+x:m+':'+x};
const ekey=k=>encodeURIComponent(k).replace(/'/g,'%27');
let CKF='all',CKQ='',CKC=false,AC=null;
const audio=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}};
function beep(){audio();try{[0,.35,.7].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+d);o.stop(AC.currentTime+d+.2)})}catch(e){}}
const tSave=()=>{save();render()};
function tStart(){const t=tmr();if(!t||t.run)return;if(t.rem<=0)t.rem=t.mins*6e4;t.end=Date.now()+t.rem;t.run=true;t.fired=false;audio();tSave()}
function tPause(){const t=tmr();if(!t||!t.run)return;t.rem=rem(t);t.run=false;tSave()}
function tReset(){const t=tmr();if(!t)return;t.run=false;t.rem=t.mins*6e4;t.fired=false;tSave()}
function tMins(v){const t=tmr();if(!t)return;v=Math.round(+v)||1;v=Math.min(600,Math.max(1,v));t.mins=v;t.fired=false;if(t.run)t.end=Date.now()+v*6e4;else t.rem=v*6e4;tSave()}
function tAdj(d){const t=tmr();if(!t)return;if(t.run)t.end=Math.max(Date.now()+1000,t.end+d*6e4);else t.rem=Math.max(0,t.rem+d*6e4);t.fired=false;tSave()}
function tWarn(v){const t=tmr();if(!t)return;t.warn=Math.min(120,Math.max(0,Math.round(+v)||0));tSave()}

cs.forEach(function(c){c.games.forEach(function(g){if(g.s==='done')nd++;else all.push({c:c,g:g})})});
if(!all.length)return h+empty(nd?'All matches are finished. See the Standings tab.':'No matches scheduled yet.');
var NC=(D.tour&&D.tour.courts)||1;all.forEach(function(x){if(x.g.court>NC)NC=x.g.court});
var sk=function(a,b){return (a.g.slot||1e6)-(b.g.slot||1e6)};
var card=function(x){return gcard(tagsOf(x.c,x.g,false),team(x.g.A),team(x.g.B),'','','',x.g.s==='live')};
for(var n=1;n<=NC;n++){var xs=all.filter(function(x){return x.g.court===n}).sort(sk);
h+=courtCard(n,xs.filter(function(x){return x.g.s==='live'}).map(function(x){return gcard(LIVE+tagsOf(x.c,x.g,false),team(x.g.A),team(x.g.B),x.g.ls?x.g.ls.a:'',x.g.ls?x.g.ls.b:'','',true)}),xs.filter(function(x){return x.g.s!=='live'}).map(card))}
var un=all.filter(function(x){return !x.g.court}).sort(sk);
if(un.length)h+='<div class="card"><h2>Court to be assigned</h2>'+un.slice(0,8).map(function(x){return gcard(tagsOf(x.c,x.g,false),team(x.g.A),team(x.g.B),'','','',false)}).join('')+'</div>';
return h}
function schedOpen(){var o=D.open;if(!o)return empty('No open play session yet.');
var h='',any=false;
for(var n=1;n<=o.courts;n++){var live=o.queue.filter(function(m){return m.court===n&&m.s==='live'}).map(function(m){return gcard(LIVE+'<span class="tag">Open play</span>',lines(m.A),lines(m.B),'','','',true)});
var up=o.queue.filter(function(m){return m.court===n&&m.s==='up'}).map(function(m){return gcard('<span class="tag">Open play</span>',lines(m.A),lines(m.B),'','','',false)});
if(live.length||up.length)any=true;h+=courtCard(n,live,up)}
var wait=o.queue.filter(function(m){return !m.court&&m.s==='up'});
if(wait.length){any=true;h+='<div class="card"><h2>Waiting queue</h2>'+wait.slice(0,12).map(function(m,i){return gcard('<span class="tag nv">#'+(i+1)+'</span>',lines(m.A),lines(m.B),'','','',false)}).join('')+'</div>'}
return any?h:empty('No matches scheduled yet.')}

/* ---------------- Standings: wins / losses and partial ranking per category ---------------- */
function resGames(cs){var L=[];cs.forEach(function(c){c.games.forEach(function(g){if(g.s==='done')L.push({c:c,g:g})})});L.sort(function(a,b){return (b.g.fin||0)-(a.g.fin||0)});
if(!L.length)return empty('No finished matches yet.');
return '<div class="card">'+L.map(function(x){var g=x.g;return gcard(tagsOf(x.c,g,true)+(g.fin?'<span class="tag">'+esc(hhmm(g.fin))+'</span>':''),team(g.A),team(g.B),g.sa,g.sb,g.w,false,g.df)}).join('')+'</div>'}
function standTour(){
var cs=selCats(),h=chips()+seg('Standings','Match results');
if(sub==='stand')return h+resGames(cs);
var any=false;
cs.forEach(function(c){if(!c.rank||!c.rank.length)return;any=true;
var fin=c.games.length>0&&c.games.every(function(g){return g.s==='done'}),played=c.games.filter(function(g){return g.s==='done'}).length;
var pod=c.rank.filter(function(x){return x.po==='Champion'||x.po==='Runner-up'||x.po==='3rd place'});
h+='<div class="card"><h2>'+esc(c.name)+' <span class="tag '+(fin?'ok':'pr')+'">'+(fin?'Final ranking':'Partial ranking')+'</span></h2><div class="mu" style="margin:-4px 0 8px">'+played+' of '+c.games.length+' matches played</div>';
if(fin&&pod.length){var cl={'Champion':'g','Runner-up':'s','3rd place':'b'},em={'Champion':'\u{1F947}','Runner-up':'\u{1F948}','3rd place':'\u{1F949}'};
h+='<div class="pod">'+pod.map(function(x){return '<div class="'+cl[x.po]+'">'+em[x.po]+' '+esc(x.po)+'<small>'+(x.t?esc(x.t)+' \u00b7 ':'')+names(x.p)+'</small></div>'}).join('')+'</div>'}
h+='<div class="tw"><table class="st"><tr><th class="n">#</th><th>Team</th><th class="n">GP</th><th class="n">W</th><th class="n">L</th><th class="n">+/\u2212</th></tr>'+c.rank.map(function(x,i){var d=x.pf-x.pa;return '<tr class="'+(i<2?'top':'')+'"><td class="n"><span class="rk">'+x.r+'</span></td><td><b>'+(x.t?esc(x.t):names(x.p))+'</b>'+(x.t?'<div class="mu">'+names(x.p)+'</div>':'')+(x.pool?'<div class="mu">Pool '+esc(x.pool)+'</div>':'')+'</td><td class="n">'+(x.gp==null?x.w+x.l:x.gp)+'</td><td class="n"><span class="wp'+(x.w?'':' z')+'">'+x.w+'</span></td><td class="n"><span class="lp'+(x.l?'':' z')+'">'+x.l+'</span></td><td class="n">'+(d>0?'+':'')+d+'</td></tr>'}).join('')+'</table></div>'+(fin?'':'<div class="mu" style="margin-top:6px">Ranking may change until all matches are finished.</div>')+'</div>'});
return any?h:h+empty('Standings will appear once matches are played.')}
function standOpen(){var o=D.open;if(!o)return empty('No open play session yet.');
var h=seg('Rankings','Match results');
if(sub==='stand')return h+(o.games.length?'<div class="card">'+o.games.map(function(g){return gcard('<span class="tag">Open play</span>'+(g.court?'<span class="tag">Court '+g.court+'</span>':'')+(g.t?'<span class="tag">'+esc(hhmm(g.t))+'</span>':''),lines(g.A),lines(g.B),g.sa,g.sb,g.w,false,g.df)}).join('')+'</div>':empty('No finished matches yet.'));
return h+(o.rank.length?'<div class="card"><h2>Open Play <span class="tag pr">Partial ranking</span></h2><div class="tw"><table class="st"><tr><th class="n">#</th><th>Player</th><th class="n">GP</th><th class="n">W</th><th class="n">L</th><th class="n">Win%</th></tr>'+o.rank.map(function(x,i){return '<tr class="'+(i<3?'top':'')+'"><td class="n"><span class="rk">'+x.r+'</span></td><td><b>'+esc(x.n)+'</b></td><td class="n">'+x.gp+'</td><td class="n"><span class="wp'+(x.w?'':' z')+'">'+x.w+'</span></td><td class="n"><span class="lp'+(x.l?'':' z')+'">'+x.l+'</span></td><td class="n">'+x.pct+'%</td></tr>'}).join('')+'</table></div></div>':empty('Rankings will appear once matches are played.'))}

function when(t){try{return t?new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):''}catch(e){return''}}
function notices(){var n=D.notices;if(!n&&D.notice&&D.notice.text)n=[{id:'n0',text:D.notice.text,ts:D.notice.ts||0}];return (n||[]).slice().sort(function(a,b){return (b.ts||0)-(a.ts||0)})}

/* ---- Announcements: animated stage in the centre, text announcements in the side pane ---- */
function annView(){
var ns=notices();
var side='<aside class="anns"><h2>\u{1F4E2} Announcements</h2>'+(ns.length?ns.map(function(n){return '<div class="nt"><div style="white-space:pre-wrap">'+esc(n.text)+'</div><div class="mu">'+esc(when(n.ts))+'</div></div>'}).join(''):'<div class="mu">No announcements yet.</div>')+'</aside>';
return '<div class="annlay"><div id="annhost"></div>'+side+'</div>'}
function vannCourts(){return mode==='open'?((D.open&&D.open.courts)||2):((D.tour&&D.tour.courts)||1)}
function vannItems(){return (((D.ann||{})[mode])||[]).slice()}
let VANN=null;
function vannConf(off,n){const cols=['#ffd54a','#ff9a3c','#7cc7ef','#fff','#3fa9f5'];let cf='';for(let k=0;k<n;k++)cf+=`<span style="left:${(k*37+11)%100}%;background:${cols[k%5]};animation-duration:${(2.6+(k*7)%18/10).toFixed(1)}s;animation-delay:${(off+(k%12)*.12).toFixed(2)}s;width:${6+k%4*3}px;height:${10+k%3*5}px"></span>`;return`<div class="ann-conf">${cf}</div>`}
function vannSemiHTML(it,pill,foot){const t=it.teams,nm=T=>T.t?`<b>${esc(T.t)}</b><small>${esc(T.p.join(' / '))}</small>`:`<b>${esc(T.p.join(' / '))}</b>`;
if(it.ph==1){const row=(T,k)=>`<div class="ann-tc ${k%2?'r':'l'}" style="animation-delay:${(.4+k*.35).toFixed(2)}s"><span class="ann-seed">${T.seed}</span><div class="ann-tcn">${nm(T)}</div><span class="ann-wl"><b>${T.w}</b><small>WINS</small></span><span class="ann-wl"><b>${T.l}</b><small>LOSS</small></span></div>`;
return`${pill}<div class="ann-banner"><span class="g">${esc(it.cat)}</span><span class="c">Top 4</span></div><div class="ann-cat">${it.prov?'Current standings \u00b7 battle for the semi-finals':'Round robin standings \u00b7 semi-finalists'}</div><div class="ann-sl">${t.map(row).join('')}</div>${foot}`}
const card=(T,d,sd)=>`<div class="ann-tc ${sd}" style="animation-delay:${d.toFixed(2)}s"><span class="ann-seed">${T.seed}</span><div class="ann-tcn">${nm(T)}</div></div>`;
const mus=[[0,3],[1,2]].map(([a,b],i)=>{const d=.4+i*1.1;return`<div class="ann-mu"><div class="ann-sfl" style="animation-delay:${d.toFixed(2)}s">Semi-final ${i+1}</div>${card(t[a],d+.2,'l')}<div class="ann-vsm" style="animation:vannVs .6s ${(d+.9).toFixed(2)}s cubic-bezier(.2,1.6,.4,1) both">VS</div>${card(t[b],d+.4,'r')}</div>`}).join('');
return`<div class="ann-flash" style="animation-delay:1.4s"></div>${pill}<div class="ann-banner"><span class="g">${esc(it.cat)}</span><span class="c">Top 4</span></div><div class="ann-cat">Semi-final match-ups</div><div class="ann-sf two">${mus}</div>${foot}`}
function vannPodHTML(it,pill,foot){const seq=[['b',it.bronze,3,'3rd place'],['s',it.silver,2,'Runner-up'],['g',it.gold,1,'Champion']].filter(x=>x[1]);
const ent=seq.map((x,i)=>{const[c,T,n,lb]=x;return{c,h:`<div class="ann-pc ${c}" style="animation-delay:${(.4+i*1.3).toFixed(2)}s"><div class="ann-mw"><div class="ann-rib"></div><div class="ann-medal ${c}">${n}</div></div><div class="ann-lbl">${lb}</div><div class="ann-nm">${T.t?`<b>${esc(T.t)}</b><small>${esc(T.p.join(' / '))}</small>`:`<b>${esc(T.p.join(' / '))}</b>`}</div><div class="ann-bar ${c}">${n}</div></div>`}});
const ord=['s','g','b'].map(c=>ent.find(e=>e.c==c)).filter(Boolean);
return`<div class="ann-flash" style="animation-delay:${(.4+(seq.length-1)*1.3).toFixed(2)}s"></div>${vannConf(.4+(seq.length-1)*1.3+.2,60)}${pill}<div class="ann-banner"><span class="g">${esc(it.cat)}</span><span class="c">Podium</span></div><div class="ann-pod" style="grid-template-columns:${ord.map(e=>e.c=='g'?'1.15fr':'1fr').join(' ')}">${ord.map(e=>e.h).join('')}</div>${foot}`}
function vannList(){let l=vannItems();if(VANN&&(VANN.kind=='semi'||VANN.kind=='pod')&&!l.some(x=>x.k==VANN.kind))VANN.kind='all';if(VANN&&VANN.court!='all')l=l.filter(x=>x.court?x.court==VANN.court:(VANN.kind=='semi'||VANN.kind=='pod'));if(VANN&&VANN.kind!='all')l=l.filter(x=>x.k==VANN.kind);return l}
function vannTop(NC){let chips=`<button class="ann-btn${VANN.court=='all'?' on':''}" onclick="vannCourt('all')">All courts</button>`;for(let n=1;n<=NC;n++)chips+=`<button class="ann-btn${VANN.court==n?' on':''}" onclick="vannCourt(${n})">Court ${n}</button>`;
const av=vannItems(),kinds=[['all','All'],['live','Game in progress'],['res','Results'],['next','Up next'],['semi','Top 4'],['pod','Podium']].map(([k,t])=>{const dis=(k=='semi'||k=='pod')&&!av.some(x=>x.k==k);return`<button class="ann-btn${VANN.kind==k?' on':''}"${dis?' disabled title="Available when all required matches are finished"':''} onclick="vannKind('${k}')">${t}</button>`}).join('');
const KN={live:'In progress',res:'Results',next:'Up next',semi:'Top 4',pod:'Podium'},fs=[VANN.court!='all'?'Court '+VANN.court:'',VANN.kind!='all'?KN[VANN.kind]:''].filter(Boolean);
return`<div class="ann-top"><button class="ann-btn ann-fbtn" id="vann-fb" aria-expanded="${VANN.fo?'true':'false'}" aria-controls="vann-menu" onclick="vannMenu()">\u2630 Filters${fs.length?' \u00b7 '+fs.join(' \u00b7 '):''}</button><div class="ann-grp flt" id="vann-menu">${chips}</div><div class="ann-grp"><button class="ann-btn" aria-label="Previous" onclick="vannNav(-1)">\u25c0</button><button class="ann-btn" aria-label="Next" onclick="vannNav(1)">\u25b6</button><button class="ann-btn${VANN.auto?' on':''}" id="vann-auto" onclick="vannAuto()">Auto</button><button class="ann-btn" aria-label="Full screen" onclick="vannFull()">\u26f6</button></div></div><div class="ann-top ann-kinds" style="padding-top:0"><div class="ann-grp">${kinds}</div></div>`}
function vannDraw(){if(!VANN)return;let el=$('#vann');if(!el){(($('#annhost')||document.body)).insertAdjacentHTML('beforeend','<div id="vann" role="region" aria-label="Match announcements"></div>');el=$('#vann')}
const NC=vannCourts();
const team=(T,c,x)=>`<div class="ann-team ${c}${T.t?'':' nt'}${x||''}">${x==' w'?'<span class="ann-crown">\u{1F451}</span>':''}${T.t?`<div class="ann-tn">${esc(T.t)}</div>`:''}<div class="ann-pl">${T.p.map((q,k)=>`<div style="animation-delay:${(.9+k*.15).toFixed(2)}s">${esc(q)}</div>`).join('')}</div></div>`;
if(VANN.res){const r=VANN.res,cols=['#ffd54a','#ff9a3c','#7cc7ef','#fff','#3fa9f5'];let cf='';if(r.win)for(let k=0;k<36;k++)cf+=`<span style="left:${(k*37+11)%100}%;background:${cols[k%5]};animation-duration:${(2.6+(k*7)%18/10).toFixed(1)}s;animation-delay:${(.9+(k%12)*.12).toFixed(2)}s;width:${6+k%4*3}px;height:${10+k%3*5}px"></span>`;
const cl=q=>r.win?(r.win==q?' w':' lo'):'';
el.innerHTML=vannTop(NC)+`<div class="ann-stage" onclick="vannSkipRes()"><div class="ann-flash"></div>${r.win?`<div class="ann-conf">${cf}</div>`:''}<div class="ann-banner"><span class="g">${esc(r.head)}</span>${r.court?`<span class="c">Court ${r.court}</span>`:''}</div><div class="ann-cat">${esc(r.cat)}${r.sub?' \u00b7 '+esc(r.sub):''}</div><div class="ann-win">${r.win?'\u{1F3C6} Winner':'Final score'}</div><div class="ann-row">${team(r.A,'l',cl('A'))}<div class="ann-score"><span${r.win=='A'?'><b>'+r.A.sc+'</b>':'>'+r.A.sc}</span> <i>\u2013</i> <span${r.win=='B'?'><b>'+r.B.sc+'</b>':'>'+r.B.sc}</span></div>${team(r.B,'r',cl('B'))}</div><div class="ann-foot">Tap to continue</div></div>`;return}
const l=vannList();if(VANN.i>=l.length)VANN.i=0;const it=l[VANN.i];let body;
if(!it)body=`<div class="ann-empty">Nothing to announce${VANN.court!='all'?' on Court '+VANN.court:''} yet.</div>`;
else{const pill=it.k=='live'?'<div class="ann-kind live"><i></i>Game in progress</div>':it.k=='res'?'<div class="ann-kind res">Latest result</div>':it.k=='semi'?'<div class="ann-kind semi">Top 4 \u00b7 Semi-finals</div>':it.k=='pod'?'<div class="ann-kind pod">Champions</div>':'<div class="ann-kind nx">Up next</div>';
const foot=`<div class="ann-foot">${VANN.i+1} / ${l.length}</div>`;
if(it.k=='semi')body=vannSemiHTML(it,pill,foot);else if(it.k=='pod')body=vannPodHTML(it,pill,foot);else if(it.k=='res'){const rt=(T,c)=>`<div class="ann-rt ${c}"><span class="ann-rn">${c=='w'?'\u{1F3C6} ':''}${T.t?`<b>${esc(T.t)}</b><small>${esc(T.p.join(' / '))}</small>`:`<b>${esc(T.p.join(' / '))}</b>`}</span><span class="ann-sc">${esc(T.sc)}</span></div>`;
body=`${pill}<div class="ann-banner"><span class="g">Court ${it.court}</span><span class="c">Latest result</span></div><div class="ann-rl">${it.rows.map((r,k)=>`<div class="ann-r${k%2?' o':''}" style="animation-delay:${(.45+k*.35).toFixed(2)}s"><div class="ann-rh">${esc(r.head)} \u00b7 ${esc(r.cat)}</div>${rt(r.A,r.win=='A'?'w':r.win?'lo':'')}${rt(r.B,r.win=='B'?'w':r.win?'lo':'')}</div>`).join('')}</div>${foot}`}
else{const hasSc=it.k=='live'&&it.A.sc!==''&&it.B.sc!=='';
body=`<div class="ann-flash"></div>${pill}<div class="ann-banner"><span class="g">${esc(it.head)}</span><span class="c">Court ${it.court}</span></div><div class="ann-cat">${esc(it.cat)}${it.sub?' \u00b7 '+esc(it.sub):''}</div><div class="ann-row">${team(it.A,'l')}${hasSc?`<div class="ann-score"><span>${esc(it.A.sc)}</span> <i>\u2013</i> <span>${esc(it.B.sc)}</span></div>`:'<div class="ann-vs">VS</div>'}${team(it.B,'r')}</div>${foot}`}}
el.innerHTML=vannTop(NC)+`<div class="ann-stage">${body}</div>`}
function vannResult(r){if(!VANN)return;VANN.q.push(r);if(!VANN.res)vannNextRes()}
function vannNextRes(){clearTimeout(VANN.rt);VANN.res=VANN.q.shift()||null;if(VANN.res)VANN.rt=setTimeout(vannSkipRes,11000);vannDraw();if(!VANN.res)vannTimer()}
function vannSkipRes(){if(!VANN)return;vannNextRes()}
function vannClearRes(){if(!VANN)return;clearTimeout(VANN.rt);VANN.res=null;VANN.q=[]}
function vannTimer(){if(!VANN)return;clearInterval(VANN.tm);if(VANN.auto)VANN.tm=setInterval(()=>{if(!VANN||VANN.res)return;const n=vannList().length;if(n>1)VANN.i=(VANN.i+1)%n;vannDraw()},9000)}
function vannOpen(){VANN={i:0,auto:true,court:'all',kind:'all',tm:0,res:null,q:[],rt:0};vannDraw();vannTimer()}
function vannClose(){if(!VANN)return;clearInterval(VANN.tm);clearTimeout(VANN.rt);VANN=null;if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen();const el=$('#vann');if(el)el.remove()}
function vannNav(d){vannClearRes();const n=vannList().length;if(!n)return;VANN.i=(VANN.i+d+n)%n;vannDraw();vannTimer()}
function vannCourt(c){if(VANN&&VANN.fo){VANN.fo=false;const e=$('#vann');if(e)e.classList.remove('fopen')}vannClearRes();VANN.court=c;VANN.i=0;vannDraw();vannTimer()}
function vannKind(k){if(VANN&&VANN.fo){VANN.fo=false;const e=$('#vann');if(e)e.classList.remove('fopen')}vannClearRes();VANN.kind=k;VANN.i=0;vannDraw();vannTimer()}
function vannAuto(){VANN.auto=!VANN.auto;const b=$('#vann-auto');if(b)b.classList.toggle('on',VANN.auto);vannTimer()}

function vannMenu(){const e=$('#vann');if(!e||!VANN)return;VANN.fo=!VANN.fo;e.classList.toggle('fopen',VANN.fo);const b=$('#vann-fb');if(b)b.setAttribute('aria-expanded',VANN.fo?'true':'false')}
Object.assign(window,{vannCourt:vannCourt,vannKind:vannKind,vannNav:vannNav,vannAuto:vannAuto,vannFull:vannFull,vannMenu:vannMenu,vannSkipRes:vannSkipRes});
function doneKeys(){var k=[];if(D.tour)D.tour.cats.forEach(function(c){c.games.forEach(function(g){if(g.s==='done')k.push({key:c.id+'|'+g.slot+'|'+g.court+'|'+g.fin,fin:g.fin||0,r:{head:g.slot?'Game '+g.slot:g.desc,court:g.court||0,cat:c.name,sub:g.slot?g.desc:'',A:{t:g.A.t,p:g.A.p,sc:g.sa},B:{t:g.B.t,p:g.B.p,sc:g.sb},win:g.w}})})});
if(D.open)D.open.games.forEach(function(g){k.push({key:'o|'+g.t,fin:g.t||0,r:{head:'Final result',court:g.court||0,cat:'Open Play',sub:'',A:{t:'',p:g.A,sc:g.sa},B:{t:'',p:g.B,sc:g.sb},win:g.w}})});
return k.sort(function(a,b){return a.fin-b.fin})}
var pendingRes=[];
function prepareResume(){
var ks=doneKeys(),seen=null;
try{seen=JSON.parse(sessionStorage.getItem('pblast')||'null')}catch(e){}
try{sessionStorage.setItem('pblast',JSON.stringify(ks.map(function(x){return x.key})))}catch(e){}

function startAnn(){
if(tab!=='live'||!$('#annhost'))return;
vannClose();vannOpen();
if(pendingRes.length){var q=pendingRes;pendingRes=[];q.forEach(function(r){vannResult(r)})}}

var role=null;try{var r0=sessionStorage.getItem('pbrole');role=(r0==='viewer'||r0==='admin'||r0==='umpire')?r0:null}catch(e){}
var ADMOK=false;var canP=(async function(){await new Promise(function(r){setTimeout(r,0)});try{if(window.claude&&window.claude.use){var u=await window.claude.use('user');if(u&&u.canEdit){var okk=!!(await u.canEdit());ADMOK=okk;return okk}}else{return true}}catch(e){}return false})();
