var h=await sha('pbump:'+n.toLowerCase()+':'+p),u=null,err='';
if(n.toLowerCase()==='ppsu'&&h===DEFH)u={id:'default',name:'PPSU',def:true,court:0};
else{var db=await getDB();if(!db)err=NODB;else{try{if(window.__pbUmpLogin){var r=await window.__pbUmpLogin(n.toLowerCase(),h);if(r)u={id:r.id,name:r.name,def:false,court:r.court||0}}else{var s=await db.collection(PBU).get();s.docs.forEach(function(d){var x=d.data();if(x&&x.key===n.toLowerCase()&&x.h===h)u={id:d.id,name:x.name,def:false,court:x.court||0}})}if(!u)err='Wrong user name or password.'}catch(e){err='Could not check the account. Try again.'}}}
umpUI.busy=false;
if(u){UMP=u;saveUMP();umpUI.view='sched';umpUI.err='';umpUI.name='';subMatches()}else umpUI.err=err||'Wrong user name or password.';
drawUmp()}
async function startMatch(gid){var x=gameOf(gid);if(!x||!UMP)return;var court=x.g.court;
if(liveOn(court)){umpUI.err='Court '+court+' already has a match in progress.';drawUmp();return}
var db=await getDB();if(!db){umpUI.err=NODB;drawUmp();return}
var d={gid:gid,state:'live',court:court,st:Date.now(),sa:0,sb:0,h:'',pts:ptsOf(),w2:false,A:x.g.A,B:x.g.B,cat:x.c.name,game:x.g.slot||0,rd:x.g.rd||0,desc:x.g.desc||'',srv:'',left:'',cfg:0,by:UMP.name},id=mid(gid);
umpUI.err='';
try{await db.doc(PBM+'/'+id).set(d)}catch(e){umpUI.err=NOWRITE;drawUmp();return}
MS[id]=d;relive();SC={id:id,d:JSON.parse(JSON.stringify(d))};drawUmp()}
function openScore(gid){var id=mid(gid),d=MS[id];if(!d||d.state!=='live')return;SC={id:id,d:JSON.parse(JSON.stringify(d))};umpUI.err='';drawUmp()}
function addPt(s){if(!SC||finished(SC.d))return;SC.d.h+=s;recount(SC.d);umpUI.err='';pushDoc(SC.d);drawUmp();try{if(SC&&SC.d.h.length===swIdx(SC.d)&&navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}
function undoPt(s){if(!SC||!SC.d.h)return;var i=SC.d.h.lastIndexOf(s);if(i<0)return;SC.d.h=SC.d.h.slice(0,i)+SC.d.h.slice(i+1);recount(SC.d);umpUI.err='';pushDoc(SC.d);drawUmp()}
async function submitScore(){if(!SC||!finished(SC.d)||umpUI.busy)return;umpUI.busy=true;umpUI.err='';drawUmp();
var d=SC.d;d.state='done';d.fin=Date.now();var ok=true;
try{var db=await getDB();if(!db)throw new Error('nodb');await wq;await db.doc(PBM+'/'+SC.id).set(JSON.parse(JSON.stringify(d)))}catch(e){ok=false;d.state='live';d.fin=0;umpUI.err=(e&&e.message==='nodb')?NODB:NOWRITE}
umpUI.busy=false;
if(ok){MS[SC.id]=JSON.parse(JSON.stringify(d));seenDone[d.gid+'|'+d.fin]=1;umpUI.last={game:d.game,cat:d.cat,A:d.A,B:d.B,sa:d.sa,sb:d.sb};SC=null;relive()}
drawUmp()}
async function loadUmps(){var db=await getDB();if(!db){umpUI.list=[];umpUI.err=NODB;drawUmp();return}
try{var s=await db.collection(PBU).get();umpUI.list=s.docs.map(function(d){var x=d.data()||{};return{id:d.id,name:x.name||'',court:x.court||0}}).sort(function(a,b){return a.name.localeCompare(b.name)})}catch(e){umpUI.list=[];umpUI.err=dbErr(e)}
if(umpUI.view==='mgr')drawUmp()}
async function makeUmp(){var n=($('#mn')||{value:''}).value.trim().replace(/\s+/g,' '),p=($('#mp')||{value:''}).value,c=+($('#mc')||{value:1}).value;
umpUI.ok='';var e=n.length<3?'The user name must be at least 3 characters.':n.toLowerCase()==='ppsu'?'That user name is reserved.':p.length<6?'The password must be at least 6 characters.':'';
if(!e&&umpUI.list&&umpUI.list.some(function(u){return u.name.toLowerCase()===n.toLowerCase()}))e='That user name is taken.';
if(e){umpUI.err=e;drawUmp();return}
var db=await getDB();if(!db){umpUI.err=NODB;drawUmp();return}
umpUI.busy=true;umpUI.err='';drawUmp();
try{var h=await sha('pbump:'+n.toLowerCase()+':'+p),id='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
await db.doc(PBU+'/'+id).set({name:n,key:n.toLowerCase(),h:h,court:c,created:Date.now()});umpUI.ok='Umpire \u201c'+n+'\u201d created for Court '+c+'.'}catch(x){umpUI.err=dbErr(x)}
umpUI.busy=false;await loadUmps();drawUmp()}
async function rmUmp(id){var db=await getDB();if(!db)return;try{await db.doc(PBU+'/'+id).delete()}catch(e){umpUI.err=dbErr(e)}await loadUmps();drawUmp()}
async function setUmpCourt(id,c){var db=await getDB();if(!db)return;try{await db.doc(PBU+'/'+id).update({court:c});umpUI.ok='Court updated.';umpUI.err=''}catch(e){umpUI.err=dbErr(e)}await loadUmps();drawUmp()}
function umpAct(a,b){
if(a==='login')return doLogin();
if(a==='rf'){location.reload();return}
if(a==='court'){UMP.court=+b.dataset.n;saveUMP();umpUI.err='';drawUmp();return}
if(a==='admlogin'){if(ADMOK){UMP={id:'default',name:'PPSU',def:true,court:0};saveUMP();umpUI.view='sched';umpUI.err='';subMatches();drawUmp()}return}
if(a==='mgr'){umpUI.view='mgr';umpUI.err='';umpUI.ok='';umpUI.list=null;drawUmp();loadUmps();return}
if(a==='sched'){umpUI.view='sched';umpUI.err='';drawUmp();return}
if(a==='start')return startMatch(b.dataset.g);
if(a==='open')return openScore(b.dataset.g);
if(a==='pt')return addPt(b.dataset.s);
if(a==='un')return undoPt(b.dataset.s);
if(a==='csrv'||a==='clft'){if(SC){SC.d[a==='csrv'?'srv':'left']=b.dataset.s;pushDoc(SC.d);drawUmp()}return}
if(a==='cgo'){if(SC&&SC.d.srv&&SC.d.left){SC.d.cfg=1;pushDoc(SC.d);drawUmp()}return}
if(a==='reset'){if(SC&&SC.d.h&&confirm('Reset the score to 0\u20130?')){SC.d.h='';recount(SC.d);pushDoc(SC.d);drawUmp()}return}
if(a==='submit')return submitScore();
if(a==='back'){SC=null;umpUI.err='';drawUmp();return}
if(a==='mk')return makeUmp();
if(a==='rm'){if(confirm('Delete this umpire account?'))rmUmp(b.dataset.id);return}
if(a==='dismiss'){umpUI.last=null;drawUmp()}}
root.addEventListener('click',function(e){var b=e.target.closest('[data-u]');if(b&&!b.disabled)umpAct(b.dataset.u,b)});
root.addEventListener('change',function(e){var t=e.target;if(t.id==='uw2'&&SC){SC.d.w2=t.checked;pushDoc(SC.d);drawUmp()}else if(t.dataset&&t.dataset.uc)setUmpCourt(t.dataset.uc,+t.value)});
root.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='up'){e.preventDefault();umpAct('login')}});

/* ---- End event (administrator): clears published data and umpire scoring ---- */
window.__pbClearOpenPub=async function(say){var msg=function(m){try{say&&say(m)}catch(e){}};
try{msg('Clearing open play from the viewer page\u2026');var ok=await publishNow(notices(),true,function(m){msg(m)});if(ok)msg('Open play cleared from the viewer page \u2713')}catch(e){msg('Could not clear the viewer page. Use the \ud83d\udce4 Publish button.')}};
window.__pbEndEvent=function(){
var m=modal('<h2>End event</h2><div class="mu">Removes the schedule, participants, standings, results and announcements from the public page and clears the umpires\u2019 live scoring. Umpire accounts and your organizer data on this device are not deleted.</div><div class="msg" id="vmsg"></div><div class="r"><button id="vcancel">Cancel</button><button class="del" id="vend">End event</button></div>');
var msg=function(t,c){var x=$('#vmsg');x.style.color=c||'#10244a';x.textContent=t};
$('#vcancel').onclick=function(){m.remove()};
$('#vend').onclick=async function(){var b=this;
if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Tap again to end the event';msg('This clears everything published to viewers.','#b3261e');setTimeout(function(){if(!b.disabled){delete b.dataset.sure;b.textContent='End event'}},5000);return}
b.disabled=true;msg('Ending event\u2026');
var warn='';try{var db=await getDB();if(db){var s=await db.collection(PBM).get();await Promise.all(s.docs.map(function(d){return db.doc(PBM+'/'+d.id).delete()}))}else warn=' (live umpire scores could not be cleared: shared database unavailable)'}catch(e){warn=' (some live umpire scores could not be cleared)'}
if(!(await publishNow([],false,function(x,c){msg(x+(c==='#2f9e2f'?warn:''),c)},{v:1,ts:Date.now(),tour:null,open:null,ann:{tour:[],open:[]},notices:[]})))b.disabled=false}};

var NAV=[['live','\u{1F4FA}','Live Monitoring'],['part','\u{1F465}','Participants'],['sched','\u{1F4C5}','Schedules'],['stand','\u{1F3C6}','Standings']];
function draw(){
if(!role){vannClose();root.innerHTML=splashDone?chooser():splash();return}
if(role==='umpire'){vannClose();drawUmp();return}
var T=D.tour,title=mode==='open'?'Open Play':(T?T.name:'PPSU Game Management');
var sbt=mode==='open'&&D.open?(D.open.courts+' courts'):(T?[fmtD(T.date),T.courts+' court'+(T.courts==1?'':'s'),T.cats.length+' categor'+(T.cats.length==1?'y':'ies')].filter(Boolean).join(' \u00b7 '):'');
var body;
if(!D.tour&&!D.open&&tab!=='live')body=empty('The organizer hasn\u2019t published anything yet. Please check back soon.');
else if(tab==='live')body=annView();
else if(mode==='open')body=tab==='part'?partOpen():tab==='sched'?schedOpen():standOpen();
else body=tab==='part'?partTour():tab==='sched'?schedTour():standTour();
var h='<header class="ab">'+(LOGO?'<img src="'+LOGO+'" alt="">':'')+'<div class="abt"><h1>'+esc(title)+'</h1><div class="sub">'+esc(sbt)+(D.ts?(sbt?' \u00b7 ':'')+'Updated '+esc(when(D.ts)):'')+'</div></div><div class="abi"><button class="ib" data-act="rf" aria-label="Refresh" title="Refresh">\u21bb</button>'+(role==='admin'?'<button class="ib" data-act="organizer" aria-label="Organizer" title="Organizer">\u{1F527}</button>':'')+'<button class="ib" data-act="role" aria-label="Switch role" title="Switch role">\u21c4</button></div></header>';
if(D.tour&&D.open)h+='<div class="seg top"><button class="'+(mode==='tour'?'on':'')+'" data-mode="tour">\u{1F3C6} Tournament</button><button class="'+(mode==='open'?'on':'')+'" data-mode="open">\u{1F3BE} Open Play</button></div>';
h+='<main'+(tab==='live'?' class="wide"':'')+'>'+body+'</main><nav>'+NAV.map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" data-tab="'+t[0]+'"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('')+'</nav>';
var y=window.scrollY;vannClose();root.innerHTML=h;window.scrollTo(0,y);startAnn()}
root.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.act==='start'){e.preventDefault();e.target.click()}});
root.addEventListener('click',function(e){
if(e.target.closest('[data-act=start]')){splashDone=true;try{sessionStorage.setItem('pbsplash','1')}catch(x){}draw();return}
var b=e.target.closest('button');if(!b)return;
if(b.dataset.role){
if(b.dataset.role==='umpire'){setRole('umpire');setBar();draw();window.scrollTo(0,0);return}
if(b.dataset.role==='viewer'){setRole('viewer');setBar();draw();window.scrollTo(0,0);return}
var m=$('#rolemsg');if(m)m.textContent='Checking access\u2026';
(window.__pbAuth?window.__pbAuth():canP).then(function(ok){ADMOK=!!ok;if(ok){setRole('admin');window.__pbAdminRole=true;showAdmin()}else{var m2=$('#rolemsg');if(m2)m2.textContent='Administrator access needs the correct admin key. You can continue as a viewer.'}});return}
if(b.dataset.act==='organizer'){showAdmin();return}
if(b.dataset.act==='role'){setRole(null);setBar();draw();window.scrollTo(0,0);return}
if(b.dataset.tab){tab=b.dataset.tab;sub='games';try{sessionStorage.setItem('pbtab',tab)}catch(x){}window.scrollTo(0,0)}
else if(b.dataset.cat)cat=b.dataset.cat;
else if(b.dataset.sub)sub=b.dataset.sub;
else if(b.dataset.mode){mode=b.dataset.mode;cat='all'}
else if(b.dataset.act==='rf'){location.reload();return}
else return;draw()});
prepareResume();
draw();
subMatches();

/* ---------- organizer tools (only for people who can edit this page) ---------- */
var adminOn=false,adminShown=false,inc=true;
function snapHTML(snap){
var out=['<!doctype html>\n<html lang="en"><head>'];
Array.prototype.forEach.call(document.head.querySelectorAll('[data-keep]'),function(el){out.push(el.outerHTML)});
out.push('</head><body>');
Array.prototype.forEach.call(document.body.querySelectorAll('[data-keep]'),function(el){
if(el.id==='snap')out.push('<script id="snap" type="application/json" data-keep>'+JSON.stringify(snap).replace(/</g,'\\u003c')+'<\/script>');
else if(el.id==='vroot')out.push('<div id="vroot" data-keep></div>');
else out.push(el.outerHTML)});
out.push('</body></html>');return out.join('\n')}
function modal(html){var m=$('#vmodal');if(m)m.remove();document.body.insertAdjacentHTML('beforeend','<div id="vmodal"><div class="bx">'+html+'</div></div>');return $('#vmodal')}
/* builds the snapshot from the organizer app and publishes it; list = text announcements to keep online */
async function publishNow(list,withAnim,msg,custom){
var snap;
try{if(custom){snap=custom}else{snap=window.__pbSnap();snap.notices=list;if(!withAnim)snap.ann={tour:[],open:[]}}}
catch(e){msg('Could not read the tournament data: '+e.message,'#d6341f');return false}
var art=null;try{art=await window.claude.use('artifact')}catch(e){}
if(!art){msg('Publishing isn\u2019t available right now. Check your internet connection and try again.','#d6341f');return false}
try{try{sessionStorage.setItem('pbadmin','1')}catch(x){}await art.publish(snapHTML(snap));msg('Published \u2713 Reloading\u2026','#2f9e2f');return true}
catch(e){var c=e&&e.code;
if(c==='conflict')msg('A newer version was published. Reloading\u2026','#d6341f');
else if(c==='permission_denied'||c==='not_writer'||c==='not_granted'||c==='consent_required')msg('Wrong or missing admin key. Choose Administrator again and re-enter the key.','#d6341f');
else if(c==='not_configured')msg('The site has no ADMIN_KEY set in Netlify yet. See the README.','#d6341f');
else if(c==='rate_limited')msg('Publishing too often. Wait a moment and try again.','#d6341f');
else msg('Publish failed ('+(c||'error')+'). Try again.','#d6341f');
return false}}
function pubDialog(){
var pa='1';try{pa=localStorage.getItem('pbtm_pubann')||'1'}catch(e){}
var ns=notices();
var list=ns.length?'<h3 style="color:#5d6f93">Published announcements</h3>'+ns.map(function(n){return '<div class="nrow"><div><div>'+esc(n.text.length>140?n.text.slice(0,140)+'\u2026':n.text)+'</div><div class="mu">'+esc(when(n.ts))+'</div></div><button class="del" data-del="'+esc(n.id)+'">Delete</button></div>'}).join(''):'';
var m=modal('<h2>Publish to viewers</h2><div class="mu">Updates the public page with the current schedule, results and announcements from this device.</div><label style="display:flex;gap:8px;align-items:flex-start;margin:12px 0 4px;font-weight:700"><input type="checkbox" id="vann" '+(pa==='1'?'checked':'')+' style="margin-top:3px"><span>Include animated match announcements and results<br><span class="mu">Viewers see them in the center of the Announcements page.</span></span></label>'+list+'<h3 style="color:#5d6f93">New text announcement (optional)</h3><textarea id="vnote" maxlength="600" placeholder="e.g. Semi-finals start at 2:00 PM. Please be ready at your court."></textarea><div class="msg" id="vmsg"></div><div class="r"><button id="vcancel">Cancel</button><button class="go" id="vgo">Publish now</button></div>');
var msg=function(t,c){var x=$('#vmsg');x.style.color=c||'#10244a';x.textContent=t};
var withAnim=function(){var v=$('#vann').checked;try{localStorage.setItem('pbtm_pubann',v?'1':'0')}catch(e){}return v};
$('#vcancel').onclick=function(){m.remove()};
Array.prototype.forEach.call(m.querySelectorAll('[data-del]'),function(b){b.onclick=async function(){
if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Tap again to delete';msg('Tap "Tap again to delete" to remove it from the public page.');setTimeout(function(){if(!b.disabled){delete b.dataset.sure;b.textContent='Delete'}},5000);return}
var id=b.dataset.del;b.disabled=true;msg('Deleting\u2026');
if(!(await publishNow(notices().filter(function(n){return n.id!==id}),withAnim(),msg)))b.disabled=false}});
$('#vgo').onclick=async function(){
var btn=this;btn.disabled=true;msg('Publishing\u2026');
var text=$('#vnote').value.trim(),l=notices();
if(text)l.unshift({id:'n'+Date.now(),text:text,ts:Date.now()});
if(!(await publishNow(l.slice(0,30),withAnim(),msg)))btn.disabled=false}}
function setBar(){var b=$('#vadmin');if(b)b.remove()}
window.__pbBtns=function(){return '<button class="menu-btn" style="margin-left:0" aria-label="Publish to viewers" title="Publish to viewers" onclick="__pbPublishDlg()">\u{1F4E4}</button><button class="menu-btn" style="margin-left:0" aria-label="Public view" title="Public view" onclick="__pbPublicView()">\u{1F441}</button><button class="menu-btn" style="margin-left:0" aria-label="End event" title="End event" onclick="__pbEndEvent()">\u{1F3C1}</button>'};
window.__pbPublishDlg=function(){pubDialog()};
window.__pbBackToRole=function(){window.__pbAdminRole=false;adminShown=false;document.body.classList.remove('adm');setRole(null);setBar();draw();window.scrollTo(0,0)};
window.__pbPublicView=function(){showPublic()};
function showAdmin(){
window.__pbAdminRole=true;adminShown=true;try{sessionStorage.setItem('pbadmin','1')}catch(e){}
vannClose();
if(!adminOn){adminOn=true;
document.body.insertAdjacentHTML('beforeend','<div id="app"></div><div id="pv"></div>');
var st=document.createElement('style');st.textContent=$('#admincss').textContent;document.head.appendChild(st);
var sc=document.createElement('script');sc.textContent=$('#adminjs').textContent;document.body.appendChild(sc)}
document.body.classList.add('adm');setBar();window.scrollTo(0,0)}
/* switching to the public view keeps the organizer app (and its sign-in) alive in the background */
function showPublic(){
adminShown=false;try{sessionStorage.setItem('pbadmin','0')}catch(e){}
document.body.classList.remove('adm');setBar();draw();window.scrollTo(0,0)}
canP.then(function(ok){
if(role!=='admin')return;
if(!ok){setRole(null);draw();return}
window.__pbAdminRole=true;
var auto=false;try{auto=sessionStorage.getItem('pbadmin')==='1'}catch(e){}
if(auto)showAdmin();else setBar()});
})();
</script>
